<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wise Spend Game - Enhanced Semester Edition</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --primary: #1d4ed8;
      --primary-2: #1e40af;
      --good: #166534;
      --warn: #9a3412;
      --bad: #991b1b;
      --border: #cbd5e1;
      --surface: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans HK", "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #e2e8f0 0%, #f8fafc 100%);
      line-height: 1.5;
    }
    .app {
      max-width: 980px;
      margin: 0 auto;
      padding: 1rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem;
      margin-bottom: 1rem;
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08);
    }
    h1, h2, h3 { margin: 0 0 0.6rem 0; }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }
    .lang-btn {
      background: var(--primary);
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 0.55rem 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .lang-btn:focus-visible,
    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #f59e0b;
      outline-offset: 2px;
    }
    .meta {
      color: var(--muted);
      font-size: 0.95rem;
      margin: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
    }
    .kpi {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem;
    }
    .kpi .label { color: var(--muted); font-size: 0.85rem; }
    .kpi .value { font-size: 1.1rem; font-weight: 800; }
    .status-good { color: var(--good); }
    .status-warn { color: var(--warn); }
    .status-bad { color: var(--bad); }
    .month-track {
      width: 100%;
      height: 10px;
      background: #dbeafe;
      border-radius: 999px;
      overflow: hidden;
    }
    .month-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1d4ed8, #2563eb);
      transition: width 0.3s ease;
    }
    .section-title {
      font-size: 1.1rem;
      margin-bottom: 0.35rem;
    }
    .small {
      font-size: 0.9rem;
      color: var(--muted);
    }
    .allocation-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.6rem;
      align-items: center;
      margin-bottom: 0.65rem;
    }
    input[type="number"] {
      width: 140px;
      padding: 0.45rem;
      border: 1px solid #94a3b8;
      border-radius: 8px;
      font-size: 1rem;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }
    button.primary,
    button.choice,
    button.secondary {
      border: 0;
      border-radius: 10px;
      padding: 0.65rem 0.85rem;
      font-size: 0.97rem;
      cursor: pointer;
    }
    button.primary { background: var(--primary); color: #fff; font-weight: 700; }
    button.primary:hover { background: var(--primary-2); }
    button.secondary { background: #e2e8f0; color: #0f172a; font-weight: 700; }
    button.choice {
      width: 100%;
      text-align: left;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      margin-bottom: 0.45rem;
    }
    button.choice:hover { background: #e2e8f0; }
    .feedback {
      border-left: 4px solid #1d4ed8;
      background: #eff6ff;
      border-radius: 8px;
      padding: 0.75rem;
      margin-top: 0.6rem;
      white-space: pre-line;
    }
    .hidden { display: none !important; }
    ul.history {
      margin: 0;
      padding-left: 1.15rem;
    }
    ul.history li { margin-bottom: 0.35rem; }
    .warn-box {
      background: #fff7ed;
      border: 1px solid #fdba74;
      color: #7c2d12;
      border-radius: 10px;
      padding: 0.65rem;
      margin-top: 0.6rem;
    }
    @media (min-width: 760px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
      .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card">
      <div class="topbar">
        <div>
          <h1 id="title"></h1>
          <p id="subtitle" class="meta"></p>
        </div>
        <button id="langToggle" class="lang-btn" type="button"></button>
      </div>
    </section>

    <section id="introCard" class="card">
      <h2 id="introTitle" class="section-title"></h2>
      <p id="introBody" class="small"></p>
      <ul id="introBullets"></ul>
    </section>

    <section id="allocationCard" class="card">
      <h2 id="allocationTitle" class="section-title"></h2>
      <p id="allocationDesc" class="small"></p>
      <div class="allocation-row">
        <label for="essentialsInput" id="labelEssentials"></label>
        <input id="essentialsInput" type="number" min="0" step="100" />
      </div>
      <div class="allocation-row">
        <label for="cashInput" id="labelCash"></label>
        <input id="cashInput" type="number" min="0" step="100" />
      </div>
      <div class="allocation-row">
        <label for="emergencyInput" id="labelEmergency"></label>
        <input id="emergencyInput" type="number" min="0" step="100" />
      </div>
      <p id="allocationTotal" class="small"></p>
      <div id="allocationWarn" class="warn-box hidden" role="status" aria-live="polite"></div>
      <div class="actions">
        <button id="startBtn" class="primary" type="button"></button>
      </div>
    </section>

    <section id="dashboardCard" class="card hidden" aria-live="polite">
      <h2 id="dashboardTitle" class="section-title"></h2>
      <div class="month-track" aria-label="Month progress">
        <div id="monthFill" class="month-fill"></div>
      </div>
      <p id="monthText" class="small"></p>
      <div class="grid">
        <article class="kpi"><div id="kCashL" class="label"></div><div id="kCashV" class="value"></div></article>
        <article class="kpi"><div id="kEmergencyL" class="label"></div><div id="kEmergencyV" class="value"></div></article>
        <article class="kpi"><div id="kDebtL" class="label"></div><div id="kDebtV" class="value"></div></article>
        <article class="kpi"><div id="kStressL" class="label"></div><div id="kStressV" class="value"></div></article>
        <article class="kpi"><div id="kWellbeingL" class="label"></div><div id="kWellbeingV" class="value"></div></article>
        <article class="kpi"><div id="kAcademicL" class="label"></div><div id="kAcademicV" class="value"></div></article>
      </div>
      <div id="riskBox" class="warn-box hidden"></div>
    </section>

    <section id="scenarioCard" class="card hidden">
      <h2 id="scenarioTitle" class="section-title"></h2>
      <p id="scenarioBody" class="small"></p>
      <div id="choiceContainer"></div>
      <div id="feedback" class="feedback hidden" role="status" aria-live="polite"></div>
      <div class="actions">
        <button id="nextBtn" class="primary hidden" type="button"></button>
      </div>
    </section>

    <section id="reportCard" class="card hidden">
      <h2 id="reportTitle" class="section-title"></h2>
      <p id="reportSummary" class="small"></p>
      <div class="grid-2">
        <article class="kpi"><div id="scoreFinancialL" class="label"></div><div id="scoreFinancialV" class="value"></div></article>
        <article class="kpi"><div id="scoreWellbeingL" class="label"></div><div id="scoreWellbeingV" class="value"></div></article>
        <article class="kpi"><div id="scoreDebtL" class="label"></div><div id="scoreDebtV" class="value"></div></article>
        <article class="kpi"><div id="scoreResilienceL" class="label"></div><div id="scoreResilienceV" class="value"></div></article>
      </div>
      <h3 id="historyTitle" class="section-title" style="margin-top:1rem;"></h3>
      <ul id="historyList" class="history"></ul>
      <h3 id="lessonsTitle" class="section-title" style="margin-top:1rem;"></h3>
      <ul id="lessonsList" class="history"></ul>
      <h3 id="reflectionTitle" class="section-title" style="margin-top:1rem;"></h3>
      <ol id="reflectionList"></ol>
      <div class="actions" style="margin-top:0.8rem;">
        <button id="replayBtn" class="secondary" type="button"></button>
      </div>
    </section>
  </main>

                zh: "短期方便能減壓，但連續高價選擇會快速侵蝕預算。"

            },
            {

              effects: { cash: 60, stress: 16, wellbeing: -16, academic: -10 },
              lesson: {
                en: "This is unhealthy and not rewarded: poor nutrition and sleep damage learning and wellbeing.",
                zh: "這不是健康節流：營養與睡眠不足會傷害學習與身心。"
              }
            },
            {
              label: { en: "Meal prep + affordable canteen + sleep routine", zh: "簡單備餐＋飯堂平衡選擇＋固定睡眠" },
              effects: { cash: -160, stress: -7, wellbeing: 10, academic: 6 },
              lesson: {
                en: "Healthy frugality supports both performance and sustainable spending.",
                zh: "健康節流可以同時提升表現與持續理財能力。"
              }
            }
          ]
        },
        {
          month: 3,
          key: "part-time",
          categoryKey: "categoryIncome",
          title: { en: "Part-time opportunity", zh: "兼職機會" },
          prompt: {
            en: "A short campus job offers pay before finals, but takes time and energy.",
            zh: "校內短期兼職可在期末前增加收入，但會佔用時間與精力。"
          },
          choices: [
            {
              label: { en: "Take extra shifts beyond your capacity", zh: "接超出負荷的班數" },
              effects: { cash: 950, stress: 14, wellbeing: -10, academic: -8 },
              lesson: {

            },
            {

              effects: { cash: 0, stress: 4, wellbeing: -2, academic: -1 },
              lesson: {

              effects: { cash: 500, stress: -3, wellbeing: 2, academic: 3 },
              lesson: {

                zh: "平衡開源策略可提升彈性，同時守住核心目標。"
              }
            }
          ]
        },
        {
          month: 3,
          key: "laptop-emergency",
          categoryKey: "categoryLaptop",
          title: { en: "Laptop crisis before final submission", zh: "期末提交前電腦危機" },
          prompt: {
            en: "Your laptop fails one day before a major deadline. You must respond quickly.",
            zh: "重大功課截止前一天，手提電腦突然故障，你必須立刻應對。"
          },
          emergency: true,
          choices: [
            {
              label: { en: "Repair immediately with borrowing allowed", zh: "即時維修，必要時接受借貸" },
              emergencyCost: 1800,
              allowBorrow: true,
              effects: { stress: -8, wellbeing: 1, academic: 8, resilience: 8 },
              lesson: {
                en: "Prepared emergency savings lower disruption. Borrowing is costly but may protect critical deadlines.",
                zh: "有緊急儲備可減低衝擊。必要借貸雖有成本，但可保住關鍵學業時點。"
              }
            },
            {
              label: { en: "Delay repair and submit from phone", zh: "延遲維修，只用手機勉強提交" },
              emergencyCost: 300,
              allowBorrow: false,
              effects: { stress: 14, wellbeing: -6, academic: -12, resilience: -8 },
              lesson: {
                en: "Avoiding immediate cost can create larger academic and emotional losses.",
                zh: "短期避開支出，可能換來更大學業與情緒損失。"
              }
            },
            {
              label: { en: "Use library loan laptop and affordable repair", zh: "借用圖書館電腦並做平價維修" },
              emergencyCost: 900,
              allowBorrow: false,
              effects: { stress: -2, wellbeing: 2, academic: 6, resilience: 10 },
              lesson: {
                en: "Combining campus resources with moderate spending improves resilience.",
                zh: "善用校內資源配合適度支出，可提升應變能力。"
              }
            }
          ]
        }
      ];

      const state = {
        lang: "en",
        started: false,
        scenarioIndex: 0,
        currentMonth: 1,
        essentialsPool: 0,
        cash: 0,
        emergency: 0,
        debt: 0,
        stress: 25,
        wellbeing: 70,
        academic: 70,
        resilience: 50,
        history: [],
        lessonsSeen: new Set(),
        scenarioAnswered: false
      };

      const el = {
        title: document.getElementById("title"),
        subtitle: document.getElementById("subtitle"),
        langToggle: document.getElementById("langToggle"),
        introTitle: document.getElementById("introTitle"),
        introBody: document.getElementById("introBody"),
        introBullets: document.getElementById("introBullets"),
        allocationTitle: document.getElementById("allocationTitle"),
        allocationDesc: document.getElementById("allocationDesc"),
        labelEssentials: document.getElementById("labelEssentials"),
        labelCash: document.getElementById("labelCash"),
        labelEmergency: document.getElementById("labelEmergency"),
        essentialsInput: document.getElementById("essentialsInput"),
        cashInput: document.getElementById("cashInput"),
        emergencyInput: document.getElementById("emergencyInput"),
        allocationTotal: document.getElementById("allocationTotal"),
        allocationWarn: document.getElementById("allocationWarn"),
        startBtn: document.getElementById("startBtn"),
        dashboardCard: document.getElementById("dashboardCard"),
        dashboardTitle: document.getElementById("dashboardTitle"),
        monthFill: document.getElementById("monthFill"),
        monthText: document.getElementById("monthText"),
        kCashL: document.getElementById("kCashL"),
        kCashV: document.getElementById("kCashV"),
        kEmergencyL: document.getElementById("kEmergencyL"),
        kEmergencyV: document.getElementById("kEmergencyV"),
        kDebtL: document.getElementById("kDebtL"),
        kDebtV: document.getElementById("kDebtV"),
        kStressL: document.getElementById("kStressL"),
        kStressV: document.getElementById("kStressV"),
        kWellbeingL: document.getElementById("kWellbeingL"),
        kWellbeingV: document.getElementById("kWellbeingV"),
        kAcademicL: document.getElementById("kAcademicL"),
        kAcademicV: document.getElementById("kAcademicV"),
        riskBox: document.getElementById("riskBox"),
        scenarioCard: document.getElementById("scenarioCard"),
        scenarioTitle: document.getElementById("scenarioTitle"),
        scenarioBody: document.getElementById("scenarioBody"),
        choiceContainer: document.getElementById("choiceContainer"),
        feedback: document.getElementById("feedback"),
        nextBtn: document.getElementById("nextBtn"),
        reportCard: document.getElementById("reportCard"),
        reportTitle: document.getElementById("reportTitle"),
        reportSummary: document.getElementById("reportSummary"),
        scoreFinancialL: document.getElementById("scoreFinancialL"),
        scoreFinancialV: document.getElementById("scoreFinancialV"),
        scoreWellbeingL: document.getElementById("scoreWellbeingL"),
        scoreWellbeingV: document.getElementById("scoreWellbeingV"),
        scoreDebtL: document.getElementById("scoreDebtL"),
        scoreDebtV: document.getElementById("scoreDebtV"),
        scoreResilienceL: document.getElementById("scoreResilienceL"),
        scoreResilienceV: document.getElementById("scoreResilienceV"),
        historyTitle: document.getElementById("historyTitle"),
        historyList: document.getElementById("historyList"),
        lessonsTitle: document.getElementById("lessonsTitle"),
        lessonsList: document.getElementById("lessonsList"),
        reflectionTitle: document.getElementById("reflectionTitle"),
        reflectionList: document.getElementById("reflectionList"),
        replayBtn: document.getElementById("replayBtn"),
        allocationCard: document.getElementById("allocationCard"),
        introCard: document.getElementById("introCard")
      };

      function tx(key) {
        return i18n[state.lang][key];
      }

      function template(text, map) {
        let output = text;
        Object.keys(map).forEach((k) => {
          output = output.replace(`{${k}}`, map[k]);
        });
        return output;
      }

      function clampStats() {
        state.stress = Math.max(0, Math.min(100, state.stress));
        state.wellbeing = Math.max(0, Math.min(100, state.wellbeing));
        state.academic = Math.max(0, Math.min(100, state.academic));
        state.resilience = Math.max(0, Math.min(100, state.resilience));
      }

      function statusText(value, low, mid) {
        if (value >= mid) return tx("statusStable");
        if (value >= low) return tx("statusWatch");
        return tx("statusRisk");
      }

      function setRiskBox(messages) {
        if (!messages.length) {
          el.riskBox.classList.add("hidden");
          el.riskBox.textContent = "";
          return;
        }
        el.riskBox.classList.remove("hidden");
        el.riskBox.textContent = messages.join(" ");
      }

      function renderHeaderAndStatic() {
        el.title.textContent = tx("title");
        el.subtitle.textContent = tx("subtitle");
        el.langToggle.textContent = tx("langBtn");
        el.introTitle.textContent = tx("introTitle");
        el.introBody.textContent = tx("introBody");

        el.introBullets.innerHTML = "";
        tx("bullets").forEach((b) => {
          const li = document.createElement("li");
          li.textContent = b;
          el.introBullets.appendChild(li);
        });

        el.allocationTitle.textContent = tx("allocationTitle");
        el.allocationDesc.textContent = tx("allocationDesc");
        el.labelEssentials.textContent = tx("essentialsLabel");
        el.labelCash.textContent = tx("cashLabel");
        el.labelEmergency.textContent = tx("emergencyLabel");
        el.startBtn.textContent = tx("startBtn");

        el.dashboardTitle.textContent = tx("dashboardTitle");
        el.kCashL.textContent = tx("kCash");
        el.kEmergencyL.textContent = tx("kEmergency");
        el.kDebtL.textContent = tx("kDebt");
        el.kStressL.textContent = tx("kStress");
        el.kWellbeingL.textContent = tx("kWellbeing");
        el.kAcademicL.textContent = tx("kAcademic");

        el.nextBtn.textContent = tx("nextBtn");

        el.reportTitle.textContent = tx("reportTitle");
        el.reportSummary.textContent = tx("reportSummary");
        el.scoreFinancialL.textContent = tx("scoreFinancialL");
        el.scoreWellbeingL.textContent = tx("scoreWellbeingL");
        el.scoreDebtL.textContent = tx("scoreDebtL");
        el.scoreResilienceL.textContent = tx("scoreResilienceL");
        el.historyTitle.textContent = tx("historyTitle");
        el.lessonsTitle.textContent = tx("lessonsTitle");
        el.reflectionTitle.textContent = tx("reflectionTitle");
        el.replayBtn.textContent = tx("replayBtn");

        el.reflectionList.innerHTML = "";
        tx("reflections").forEach((q) => {
          const li = document.createElement("li");
          li.textContent = q;
          el.reflectionList.appendChild(li);
        });
      }

      function renderAllocationSummary() {
        const e = Number(el.essentialsInput.value || 0);
        const c = Number(el.cashInput.value || 0);
        const m = Number(el.emergencyInput.value || 0);
        const allocated = e + c + m;
        const remaining = START_BUDGET - allocated;
        el.allocationTotal.textContent = template(tx("allocationText"), {
          allocated: formatHKD(allocated),
          remaining: formatHKD(remaining)
        });

        el.allocationWarn.classList.add("hidden");
        if (allocated > START_BUDGET) {
          el.allocationWarn.textContent = tx("allocWarnOver");
          el.allocationWarn.classList.remove("hidden");
        } else if (allocated !== START_BUDGET) {
          el.allocationWarn.textContent = tx("allocWarnMismatch");
          el.allocationWarn.classList.remove("hidden");
        } else if (e < MONTHLY_ESSENTIAL_COST * TOTAL_MONTHS) {
          el.allocationWarn.textContent = tx("allocWarnLowEssentials");
          el.allocationWarn.classList.remove("hidden");
        }
      }

      function renderDashboard() {
        const currentScenario = Math.min(state.scenarioIndex + 1, scenarios.length);
        el.monthText.textContent = template(tx("monthText"), {
          current: state.currentMonth,
          scenario: `${currentScenario}/${scenarios.length}`
        });
        el.monthFill.style.width = `${(state.currentMonth / TOTAL_MONTHS) * 100}%`;

        el.kCashV.textContent = formatHKD(state.cash);
        el.kEmergencyV.textContent = formatHKD(state.emergency);
        el.kDebtV.textContent = formatHKD(state.debt);
        el.kStressV.textContent = `${state.stress} · ${statusText(100 - state.stress, 35, 65)}`;
        el.kWellbeingV.textContent = `${state.wellbeing} · ${statusText(state.wellbeing, 45, 70)}`;
        el.kAcademicV.textContent = `${state.academic} · ${statusText(state.academic, 45, 70)}`;

        const risk = [];
        if (state.debt > 1000) risk.push(tx("riskDebt"));
        if (state.cash < 500 && state.emergency < 500) risk.push(tx("riskLowCash"));
        if (state.wellbeing < 40) risk.push(tx("riskLowWellbeing"));
        setRiskBox(risk);
      }

      function applyRecurringForMonth(month) {
        const feedbackLines = [];

        if (state.debt > 0) {
          const interest = Math.round(state.debt * MONTHLY_DEBT_INTEREST);
          state.debt += interest;
          feedbackLines.push(template(tx("debtInterest"), { amount: formatHKD(interest) }));

          const minPayment = Math.max(50, Math.round(state.debt * 0.2));
          const paid = Math.min(state.cash, minPayment, state.debt);
          state.cash -= paid;
          state.debt -= paid;
          feedbackLines.push(template(tx("debtPayment"), { amount: formatHKD(paid) }));
          if (paid < minPayment) {
            state.stress += 5;
            state.wellbeing -= 3;
            feedbackLines.push(tx("debtShortPayment"));
          }
        }

        let costLeft = MONTHLY_ESSENTIAL_COST;
        if (state.essentialsPool >= costLeft) {
          state.essentialsPool -= costLeft;
          costLeft = 0;
        } else {
          costLeft -= state.essentialsPool;
          state.essentialsPool = 0;
        }

        let usedCash = 0;
        if (costLeft > 0) {
          const use = Math.min(state.cash, costLeft);
          state.cash -= use;
          usedCash += use;
          costLeft -= use;
        }

        if (costLeft > 0) {
          state.debt += costLeft;
          state.stress += 7;
          state.wellbeing -= 5;
          feedbackLines.push(tx("recurringShortfall"));
        }

        feedbackLines.unshift(template(tx("recurringDeducted"), { month: String(month), amount: formatHKD(MONTHLY_ESSENTIAL_COST) }));
        clampStats();
        return feedbackLines;
      }

      function applyEmergencyCost(amount, allowBorrow) {
        let left = amount;
        const emergencyUsed = Math.min(state.emergency, left);
        state.emergency -= emergencyUsed;
        left -= emergencyUsed;

        const cashUsed = Math.min(state.cash, left);
        state.cash -= cashUsed;
        left -= cashUsed;

        let debtAdded = 0;
        if (left > 0) {
          if (allowBorrow) {
            state.debt += left;
            debtAdded = left;
            left = 0;
            state.stress += 5;
          } else {
            state.academic -= 6;
            state.resilience -= 4;
            state.stress += 6;
          }
        }

        clampStats();
        return {
          emergencyUsed,
          cashUsed,
          debtAdded,
          unresolved: left > 0
        };
      }

      function recordHistory(scenario, choice, summary) {
        state.history.push({
          month: scenario.month,
          title: scenario.title,
          categoryKey: scenario.categoryKey,
          choiceLabel: choice.label,
          summary
        });
      }

      function renderScenario() {
        if (state.scenarioIndex >= scenarios.length) {
          endGame();
          return;
        }

        const scenario = scenarios[state.scenarioIndex];
        state.currentMonth = scenario.month;
        state.scenarioAnswered = false;
        el.feedback.classList.add("hidden");
        el.feedback.textContent = "";
        el.nextBtn.classList.add("hidden");

        el.scenarioTitle.textContent = `${tx(scenario.categoryKey)} · ${scenario.title[state.lang]}`;
        el.scenarioBody.textContent = scenario.prompt[state.lang];

        el.choiceContainer.innerHTML = "";
        scenario.choices.forEach((choice, index) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "choice";
          btn.textContent = `${String.fromCharCode(65 + index)}. ${choice.label[state.lang]}`;
          btn.addEventListener("click", () => chooseOption(choice));
          el.choiceContainer.appendChild(btn);
        });

        renderDashboard();
      }

      function rerenderScenarioTextOnly() {
        if (state.scenarioIndex >= scenarios.length) return;
        const scenario = scenarios[state.scenarioIndex];
        el.scenarioTitle.textContent = `${tx(scenario.categoryKey)} · ${scenario.title[state.lang]}`;
        el.scenarioBody.textContent = scenario.prompt[state.lang];
        const buttons = el.choiceContainer.querySelectorAll("button.choice");
        scenario.choices.forEach((choice, index) => {
          if (buttons[index]) {
            buttons[index].textContent = `${String.fromCharCode(65 + index)}. ${choice.label[state.lang]}`;
          }
        });
      }

      function chooseOption(choice) {
        if (state.scenarioAnswered) return;
        const scenario = scenarios[state.scenarioIndex];

        let feedbackLines = [];
        if (scenario.emergency) {
          const result = applyEmergencyCost(choice.emergencyCost || 0, Boolean(choice.allowBorrow));
          feedbackLines.push(template(tx("emergencyUse"), {
            emergencyUsed: formatHKD(result.emergencyUsed),
            cashUsed: formatHKD(result.cashUsed),
            debtAdded: formatHKD(result.debtAdded)
          }));
          if (result.unresolved) {
            feedbackLines.push(tx("emergencyNoBorrow"));
          }
        } else {
          state.cash += choice.effects.cash || 0;
          state.debt += choice.effects.debt || 0;
        }

        state.stress += choice.effects.stress || 0;
        state.wellbeing += choice.effects.wellbeing || 0;
        state.academic += choice.effects.academic || 0;
        state.resilience += choice.effects.resilience || 0;
        clampStats();

        feedbackLines.push(choice.lesson[state.lang]);
        const summary = feedbackLines.join(" ");

        recordHistory(scenario, choice, summary);
        state.lessonsSeen.add(choice.lesson[state.lang]);

        el.feedback.textContent = summary || tx("defaultFeedback");
        el.feedback.classList.remove("hidden");
        state.scenarioAnswered = true;
        el.nextBtn.classList.remove("hidden");
        renderDashboard();
      }

      function scoreLabel(value) {
        if (value >= 75) return `${value} · ${tx("statusStable")}`;
        if (value >= 50) return `${value} · ${tx("statusWatch")}`;
        return `${value} · ${tx("statusRisk")}`;
      }

      function endGame() {
        el.scenarioCard.classList.add("hidden");
        el.reportCard.classList.remove("hidden");

        const netWorth = state.cash + state.emergency + state.essentialsPool - state.debt;
        const financialSecurity = Math.max(0, Math.min(100, Math.round((netWorth / START_BUDGET) * 100 + 35)));
        const wellbeingScore = Math.max(0, Math.min(100, Math.round((state.wellbeing + (100 - state.stress)) / 2)));
        const debtResponsibility = Math.max(0, Math.min(100, Math.round(100 - (state.debt / START_BUDGET) * 130)));
        const resilienceScore = Math.max(0, Math.min(100, Math.round((state.resilience + state.academic) / 2)));

        el.scoreFinancialV.textContent = `${scoreLabel(financialSecurity)} (${formatHKD(netWorth)})`;
        el.scoreWellbeingV.textContent = scoreLabel(wellbeingScore);
        el.scoreDebtV.textContent = `${scoreLabel(debtResponsibility)} (${formatHKD(state.debt)})`;
        el.scoreResilienceV.textContent = scoreLabel(resilienceScore);

        el.historyList.innerHTML = "";
        state.history.forEach((h) => {
          const li = document.createElement("li");
          li.textContent = `M${h.month} ${tx(h.categoryKey)} - ${h.choiceLabel[state.lang]}: ${h.summary}`;
          el.historyList.appendChild(li);
        });

        el.lessonsList.innerHTML = "";
        Array.from(state.lessonsSeen).slice(0, 8).forEach((lesson) => {
          const li = document.createElement("li");
          li.textContent = lesson;
          el.lessonsList.appendChild(li);
        });
      }

      function nextStep() {
        if (!state.started) return;
        state.scenarioIndex += 1;
        if (state.scenarioIndex >= scenarios.length) {
          endGame();
          return;
        }

        const monthNow = scenarios[state.scenarioIndex].month;
        const monthPrev = scenarios[state.scenarioIndex - 1].month;
        let recurringMessage = "";
        if (monthNow !== monthPrev) {
          const recurringMsgs = applyRecurringForMonth(monthNow);
          recurringMessage = recurringMsgs.join(" ");
        }
        renderScenario();
        if (recurringMessage) {
          el.feedback.textContent = recurringMessage;
          el.feedback.classList.remove("hidden");
        }
      }

      function resetGame() {
        state.started = false;
        state.scenarioIndex = 0;
        state.currentMonth = 1;
        state.essentialsPool = 0;
        state.cash = 0;
        state.emergency = 0;
        state.debt = 0;
        state.stress = 25;
        state.wellbeing = 70;
        state.academic = 70;
        state.resilience = 50;
        state.history = [];
        state.lessonsSeen = new Set();
        state.scenarioAnswered = false;

        el.essentialsInput.value = "4800";
        el.cashInput.value = "3000";
        el.emergencyInput.value = "1200";

        el.allocationCard.classList.remove("hidden");
        el.introCard.classList.remove("hidden");
        el.dashboardCard.classList.add("hidden");
        el.scenarioCard.classList.add("hidden");
        el.reportCard.classList.add("hidden");

        renderHeaderAndStatic();
        renderAllocationSummary();
      }

      function startGame() {
        const essentials = Number(el.essentialsInput.value || 0);
        const cash = Number(el.cashInput.value || 0);
        const emergency = Number(el.emergencyInput.value || 0);
        const total = essentials + cash + emergency;

        if (total > START_BUDGET) {
          el.allocationWarn.textContent = tx("allocWarnOver");
          el.allocationWarn.classList.remove("hidden");
          return;
        }
        if (total !== START_BUDGET) {
          el.allocationWarn.textContent = tx("allocWarnMismatch");
          el.allocationWarn.classList.remove("hidden");
          return;
        }

        state.started = true;
        state.essentialsPool = essentials;
        state.cash = cash;
        state.emergency = emergency;
        state.debt = 0;
        state.scenarioIndex = 0;
        state.history = [];
        state.lessonsSeen = new Set();
        state.stress = 25;
        state.wellbeing = 70;
        state.academic = 70;
        state.resilience = 50;

        const recurringMsgs = applyRecurringForMonth(1);

        el.introCard.classList.add("hidden");
        el.allocationCard.classList.add("hidden");
        el.dashboardCard.classList.remove("hidden");
        el.scenarioCard.classList.remove("hidden");

        renderScenario();
        el.feedback.textContent = recurringMsgs.join(" ");
        el.feedback.classList.remove("hidden");
      }

      el.langToggle.addEventListener("click", function () {
        state.lang = state.lang === "en" ? "zh" : "en";
        renderHeaderAndStatic();
        if (state.started && state.scenarioIndex < scenarios.length) {
          rerenderScenarioTextOnly();
        }
        if (state.started) {
          renderDashboard();
        }
      });

      [el.essentialsInput, el.cashInput, el.emergencyInput].forEach((input) => {
        input.addEventListener("input", renderAllocationSummary);
      });

      el.startBtn.addEventListener("click", startGame);
      el.nextBtn.addEventListener("click", nextStep);
      el.replayBtn.addEventListener("click", resetGame);

      resetGame();
    })();
  </script>
