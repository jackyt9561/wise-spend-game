<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大學生存指南：90日財務保衛戰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .progress-bar { transition: width 0.5s ease-in-out, background-color 0.5s ease-in-out; }
        .app-container { max-width: 480px; margin: 0 auto; min-height: 100vh; background-color: #ffffff; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); position: relative; display: flex; flex-direction: column; }
        .hide-on-export { display: flex; }
        .exporting .hide-on-export { display: none !important; }
    </style>
</head>
<body class="text-gray-800 antialiased">

<div class="app-container">

    <!-- Language Toggle Button -->
    <div class="absolute top-4 right-4 z-50">
        <button onclick="toggleLanguage()" class="bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-1.5 px-3.5 rounded-full shadow-sm text-xs border border-gray-300 transition-colors">
            <span id="lang-toggle-text">EN</span>
        </button>
    </div>
    
    <!-- Start Screen -->
    <div id="start-screen" class="flex-1 flex flex-col justify-center items-center p-6 text-center fade-in overflow-y-auto">
        <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mb-4 shadow-inner">
            <span class="text-3xl">🎓</span>
        </div>
        <h1 id="game-title" class="text-2xl font-extrabold text-gray-900 mb-2 tracking-tight"></h1>
        <p id="game-subtitle" class="text-xs text-blue-600 font-bold mb-4 uppercase tracking-wider"></p>
        
        <div class="bg-gray-50 border border-gray-200 rounded-2xl p-4 mb-6 text-left w-full shadow-sm">
            <p id="tutorial-title" class="text-sm font-bold text-gray-800 mb-2"></p>
            <ul id="tutorial-rules" class="text-xs text-gray-600 space-y-3 leading-relaxed">
            </ul>
        </div>

        <button id="start-btn" onclick="startGame()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-8 rounded-xl shadow-lg transition-transform transform active:scale-95 text-sm">
        </button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="hidden flex-1 flex-col h-full fade-in">
        <!-- Header -->
        <div class="bg-white px-6 py-4 border-b border-gray-100 sticky top-0 z-10 shadow-sm">
            <div class="flex justify-between items-end mb-2">
                <div>
                    <p id="budget-label" class="text-[10px] text-gray-400 font-semibold uppercase tracking-wider mb-0.5"></p>
                    <p class="text-xl font-bold text-gray-900 flex items-baseline">
                        <span class="text-sm text-gray-500 mr-0.5">$</span><span id="money-display">6000</span>
                    </p>
                </div>
                <div class="text-right">
                    <p id="progress-label" class="text-[10px] text-gray-400 font-semibold uppercase tracking-wider mb-0.5"></p>
                    <p class="text-xs font-bold text-blue-600 transition-colors duration-300" id="stage-display"></p>
                </div>
            </div>
            
            <div class="mb-3">
                <div class="w-full bg-gray-100 rounded-full h-1.5 overflow-hidden">
                    <div id="budget-bar" class="progress-bar bg-blue-500 h-1.5 rounded-full" style="width: 100%"></div>
                </div>
            </div>
            
            <div>
                <div class="flex justify-between items-end mb-1">
                    <span id="stress-label" class="text-[10px] font-semibold text-gray-500"></span>
                    <span class="text-[10px] font-bold text-gray-700" id="stress-text">0/100</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2 overflow-hidden">
                    <div id="stress-bar" class="progress-bar bg-green-500 h-2 rounded-full" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Scenario Area -->
        <div class="flex-1 overflow-y-auto p-6 bg-gray-50 pb-20">
            
            <!-- Question Card -->
            <div id="question-card" class="fade-in">
                <div class="flex items-center justify-between mb-2">
                    <span id="question-progress" class="text-xs font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full transition-colors duration-300"></span>
                </div>
                <h2 id="scenario-title" class="text-base font-bold text-gray-800 mb-1.5"></h2>
                <p id="scenario-desc" class="text-sm text-gray-600 mb-5 leading-relaxed"></p>
                <div id="options-container" class="space-y-3"></div>
            </div>

            <!-- Feedback Card -->
            <div id="feedback-card" class="hidden fade-in bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                <div class="mb-4 p-3.5 bg-gray-50 rounded-xl border-l-4 border-blue-500">
                    <p id="feedback-quote-label" class="text-[10px] text-gray-400 font-semibold uppercase tracking-wider mb-1.5"></p>
                    <p id="feedback-quote" class="italic text-xs text-gray-700 font-medium"></p>
                </div>
                <div class="mb-5">
                    <p id="feedback-lesson-label" class="text-[10px] text-gray-400 font-semibold uppercase tracking-wider mb-1.5"></p>
                    <p id="feedback-lesson" class="text-xs text-gray-800 leading-relaxed"></p>
                </div>
                <div id="stat-changes" class="flex gap-3 mb-5"></div>
                <button id="next-stage-btn" onclick="nextStage()" class="w-full bg-gray-900 hover:bg-gray-800 text-white font-bold py-3 px-5 rounded-xl text-sm transition-transform transform active:scale-95"></button>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <!-- Stress Modal -->
    <div id="stress-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-6 fade-in">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl text-center">
            <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-4">🤯</div>
            <h3 id="stress-warning-title" class="text-xl font-bold text-gray-900 mb-2"></h3>
            <p id="stress-warning-desc" class="text-sm text-gray-600 mb-6"></p>
            <button id="stress-report-btn" onclick="generateReport()" class="w-full bg-gray-900 hover:bg-gray-800 text-white font-bold py-3 px-4 rounded-xl text-sm transition-transform active:scale-95"></button>
        </div>
    </div>

    <!-- Bankrupt Modal -->
    <div id="bankrupt-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-6 fade-in">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl text-center">
            <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-4">💸</div>
            <h3 id="bankrupt-warning-title" class="text-xl font-bold text-gray-900 mb-2"></h3>
            <p id="bankrupt-warning-desc" class="text-sm text-gray-600 mb-6"></p>
            <button id="bankrupt-report-btn" onclick="generateReport()" class="w-full bg-gray-900 hover:bg-gray-800 text-white font-bold py-3 px-4 rounded-xl text-sm transition-transform active:scale-95"></button>
        </div>
    </div>

    <!-- Crisis Modal -->
    <div id="crisis-modal" class="hidden fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-6 fade-in">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl text-center border-4 border-red-500">
            <div class="w-20 h-20 bg-red-600 text-white rounded-full flex items-center justify-center text-4xl mx-auto mb-4 animate-pulse">🚨</div>
            <h3 id="crisis-title" class="text-2xl font-black text-red-600 mb-2 tracking-wide"></h3>
            <p id="crisis-desc" class="text-sm text-gray-700 mb-6 font-medium"></p>
            <button id="face-crisis-btn" onclick="faceCrisis()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 px-4 rounded-xl text-sm transition-transform active:scale-95"></button>
        </div>
    </div>

    <!-- Report Screen -->
    <div id="report-screen" class="hidden flex-1 flex-col bg-white overflow-y-auto fade-in">
        <div id="report-content" class="p-6 bg-white">
            <div class="text-center my-2 mb-6">
                <div id="report-icon" class="w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-3 shadow-sm text-3xl"></div>
                <h2 id="report-title" class="text-2xl font-bold mb-1 text-gray-900"></h2>
                <p id="report-subtitle-label" class="text-[10px] text-gray-500 uppercase tracking-wider"></p>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-5">
                <div class="bg-gray-50 p-3.5 rounded-xl border border-gray-100 text-center">
                    <p id="report-budget-label" class="text-[10px] text-gray-400 font-semibold uppercase mb-1"></p>
                    <p id="report-money" class="text-xl font-bold text-gray-900">$0</p>
                </div>
                <div class="bg-gray-50 p-3.5 rounded-xl border border-gray-100 text-center">
                    <p id="report-stress-label" class="text-[10px] text-gray-400 font-semibold uppercase mb-1"></p>
                    <p id="report-stress-val" class="text-xl font-bold text-gray-900">0/100</p>
                </div>
            </div>

            <div class="bg-blue-50/50 border border-blue-100 rounded-xl p-4 mb-5">
                <p id="report-stress-analysis-title" class="text-xs font-bold text-blue-900 mb-1"></p>
                <p id="report-stress-desc" class="text-xs text-blue-800 leading-relaxed"></p>
            </div>

            <div class="bg-gray-50 border border-gray-200 rounded-xl p-4 mb-6">
                <p id="report-advice-title" class="text-xs font-bold text-gray-900 mb-1"></p>
                <p id="report-advice" class="text-xs text-gray-700 leading-relaxed"></p>
            </div>

            <div class="mb-2">
                <p id="report-history-title" class="text-xs font-bold text-gray-800 mb-3 uppercase tracking-wider"></p>
                <div id="report-history" class="space-y-2.5"></div>
            </div>
            
            <p class="text-[10px] text-center text-gray-300 mt-6 pt-4 border-t border-gray-100">大學生存指南：90日財務保衛戰</p>
        </div>

        <div class="p-6 pt-0 bg-white hide-on-export flex-col space-y-3">
            <button onclick="downloadScreenshot()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 px-6 rounded-xl text-sm shadow-md transition-transform transform active:scale-95 flex items-center justify-center gap-2">
                <span id="download-btn-text"></span>
            </button>
            <button id="restart-btn" onclick="resetGame()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-3.5 px-6 rounded-xl text-sm transition-transform transform active:scale-95"></button>
        </div>
    </div>
</div>

        document.getElementById('stage-display').innerText = gameData[currentStage].stageId[currentLang];
        
        const budgetPercent = Math.max(0, Math.min(100, (money / 6000) * 100));
        const budgetBar = document.getElementById('budget-bar');
        budgetBar.style.width = budgetPercent + "%";
        
        if (money >= 3000) { budgetBar.className = "progress-bar bg-blue-500 h-1.5 rounded-full"; } 
        else if (money >= 1000) { budgetBar.className = "progress-bar bg-yellow-400 h-1.5 rounded-full"; } 
        else { budgetBar.className = "progress-bar bg-red-500 h-1.5 rounded-full"; }

        stress = Math.max(0, Math.min(100, stress));
        document.getElementById('stress-text').innerText = stress + "/100";
        
        const stressBar = document.getElementById('stress-bar');
        stressBar.style.width = stress + "%";
        
        if (stress < 40) { stressBar.className = "progress-bar bg-green-500 h-2 rounded-full"; } 
        else if (stress < 75) { stressBar.className = "progress-bar bg-yellow-500 h-2 rounded-full"; } 
        else { stressBar.className = "progress-bar bg-red-600 h-2 rounded-full"; }
    }

    function loadQuestion(isReRender = false) {
        if (!isReRender) updateStats();
        
        document.getElementById('feedback-card').classList.add('hidden');
        document.getElementById('question-card').classList.remove('hidden');
        
        const currentQ = gameData[currentStage];
        const qProgress = document.getElementById('question-progress');
        qProgress.innerText = t[currentLang].questionProgress(currentStage + 1, gameData.length);
        
        document.getElementById('scenario-title').innerText = currentQ.title[currentLang];
        document.getElementById('scenario-desc').innerText = currentQ.description[currentLang];
        
        const isFinalStage = currentStage === gameData.length - 1;
        const stageDisplay = document.getElementById('stage-display');
        
        if (isFinalStage) {
            stageDisplay.classList.remove('text-blue-600');
            stageDisplay.classList.add('text-red-600');
            qProgress.classList.remove('text-blue-600', 'bg-blue-50');
            qProgress.classList.add('text-white', 'bg-red-600');
        } else {
            stageDisplay.classList.add('text-blue-600');
            stageDisplay.classList.remove('text-red-600');
            qProgress.classList.add('text-blue-600', 'bg-blue-50');
            qProgress.classList.remove('text-white', 'bg-red-600');
        }

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        currentQ.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = "w-full text-left p-4 bg-white hover:bg-blue-50 border border-gray-200 hover:border-blue-300 rounded-xl text-xs font-medium text-gray-700 transition-all shadow-sm active:scale-[0.98] flex items-center justify-between";
            btn.innerHTML = `<span>${opt.text[currentLang]}</span> <span class="text-gray-400 text-sm">→</span>`;
            btn.onclick = () => selectOption(index);
            optionsContainer.appendChild(btn);
        });

        const nextBtn = document.getElementById('next-stage-btn');
        nextBtn.innerText = isFinalStage ? t[currentLang].finalNextBtn : t[currentLang].nextBtn;
    }

    function selectOption(optionIndex) {
        const currentQ = gameData[currentStage];
        const selectedOpt = currentQ.options[optionIndex];
        
        money += selectedOpt.moneyChange;
        stress += selectedOpt.stressChange;
        
        choiceHistory.push({ stageIdx: currentStage, optionIdx: optionIndex });
        lastSelectedOptionIndex = optionIndex;
        
        updateStats();
        renderFeedback();
    }

    function renderFeedback() {
        document.getElementById('question-card').classList.add('hidden');
        document.getElementById('feedback-card').classList.remove('hidden');
        
        const selectedOpt = gameData[currentStage].options[lastSelectedOptionIndex];
        document.getElementById('feedback-quote').innerText = `"${selectedOpt.quote[currentLang]}"`;
        document.getElementById('feedback-lesson').innerText = selectedOpt.lesson[currentLang];
        
        const moneyColor = selectedOpt.moneyChange >= 0 ? 'text-green-600' : 'text-red-600';
        const moneySign = selectedOpt.moneyChange >= 0 ? '+' : '';
        const stressColor = selectedOpt.stressChange <= 0 ? 'text-green-600' : 'text-orange-600';
        const stressSign = selectedOpt.stressChange > 0 ? '+' : '';

        document.getElementById('stat-changes').innerHTML = `
            <div class="flex-1 bg-gray-50 p-2.5 rounded-lg text-center border border-gray-100">
                <span class="text-[10px] text-gray-400 block uppercase font-semibold mb-0.5">${t[currentLang].budgetChange}</span>
                <span class="text-xs font-bold ${moneyColor}">${moneySign}$${selectedOpt.moneyChange}</span>
            </div>
            <div class="flex-1 bg-gray-50 p-2.5 rounded-lg text-center border border-gray-100">
                <span class="text-[10px] text-gray-400 block uppercase font-semibold mb-0.5">${t[currentLang].stressChange}</span>
                <span class="text-xs font-bold ${stressColor}">${stressSign}${selectedOpt.stressChange}</span>
            </div>
        `;
    }

    function nextStage() {
        if (money <= 0 && !isBankrupt) {
            isBankrupt = true;
            document.getElementById('bankrupt-modal').classList.remove('hidden');
            return;
        }

        if (stress >= 100 && !isStressExploded) {
            isStressExploded = true;
            document.getElementById('stress-modal').classList.remove('hidden');
            return;
        }

        if (currentStage === gameData.length - 2 && !isCrisisShown) {
            isCrisisShown = true;
            document.getElementById('crisis-modal').classList.remove('hidden');
            return;
        }

        currentStage++;
        if (currentStage < gameData.length) {
            loadQuestion();
        } else {
            generateReport();
        }
    }

    function faceCrisis() {
        document.getElementById('crisis-modal').classList.add('hidden');
        currentStage++;
        loadQuestion();
    }

    function generateReport() {
        document.getElementById('stress-modal').classList.add('hidden');
        document.getElementById('bankrupt-modal').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('flex');
        document.getElementById('game-screen').classList.add('hidden');
        
        document.getElementById('report-screen').classList.remove('hidden');
        document.getElementById('report-screen').classList.add('flex');
        
        document.getElementById('report-money').innerText = `$${money}`;
        document.getElementById('report-stress-val').innerText = `${stress}/100`;
        
        const iconEl = document.getElementById('report-icon');
        const titleEl = document.getElementById('report-title');
        
        let countA = 0, countB = 0, countC = 0;
        choiceHistory.forEach(item => {
            const type = gameData[item.stageIdx].options[item.optionIdx].type;
            if (type === 'A') countA++;
            if (type === 'B') countB++;
            if (type === 'C') countC++;
        });

        let adviceText = "", stressDescText = "";
        
        if (stress >= 100) {
            iconEl.innerText = "🤯";
            iconEl.className = "w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-3 shadow-sm text-3xl bg-red-100 text-red-600";
            titleEl.innerText = t[currentLang].reportStressTitle;
            titleEl.className = "text-2xl font-bold mb-1 text-red-600";
            stressDescText = t[currentLang].reportStressDesc100;
            adviceText = t[currentLang].reportAdviceStress.replace('{countB}', countB);
        } else if (money <= 0) {
            iconEl.innerText = "💸";
            iconEl.className = "w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-3 shadow-sm text-3xl bg-red-100 text-red-600";
            titleEl.innerText = t[currentLang].reportBankruptTitle;
            titleEl.className = "text-2xl font-bold mb-1 text-red-600";
            stressDescText = stress > 70 ? t[currentLang].reportStressDescHigh : t[currentLang].reportStressDescBankrupt;
            adviceText = t[currentLang].reportAdviceBankrupt.replace('{countA}', countA);
        } else {
            iconEl.innerText = "🏆";
            iconEl.className = "w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-3 shadow-sm text-3xl bg-green-100 text-green-600";
            titleEl.innerText = t[currentLang].reportSuccessTitle;
            titleEl.className = "text-2xl font-bold mb-1 text-green-600";
            stressDescText = stress > 70 ? t[currentLang].reportStressDescHighSurvive : t[currentLang].reportStressDescGood;
            
            if (countC >= 5) {
                adviceText = t[currentLang].reportAdviceSmart.replace('{countC}', countC);
            } else if (countB >= 5) {
                adviceText = t[currentLang].reportAdviceOverSave.replace('{countB}', countB);
            } else {
                adviceText = t[currentLang].reportAdviceBalanced;
            }
        }
        
        document.getElementById('report-stress-desc').innerText = stressDescText;
        document.getElementById('report-advice').innerText = adviceText;
        
        const historyContainer = document.getElementById('report-history');
        historyContainer.innerHTML = '';
        choiceHistory.forEach((item, idx) => {
            const stage = gameData[item.stageIdx];
            const opt = stage.options[item.optionIdx];
            const div = document.createElement('div');
            div.className = "p-3 bg-gray-50 rounded-xl border border-gray-100 text-xs";
            div.innerHTML = `
                <div class="flex justify-between font-bold text-gray-800 mb-1">
                    <span>Q${idx+1}. ${stage.title[currentLang]}</span>
                    <span class="${opt.moneyChange >= 0 ? 'text-green-600' : 'text-red-600'}">${opt.moneyChange >= 0 ? '+' : ''}$${opt.moneyChange}</span>
                </div>
                <p class="text-gray-600 mb-1">${t[currentLang].choiceLabel}${opt.text[currentLang]}</p>
                <p class="text-[10px] text-blue-600 italic">💡 ${opt.lesson[currentLang]}</p>
            `;
            historyContainer.appendChild(div);
        });
    }

    function resetGame() {
        document.getElementById('report-screen').classList.remove('flex');
        document.getElementById('report-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
        document.getElementById('start-screen').classList.add('flex');
    }

    function downloadScreenshot() {
        const reportElement = document.getElementById('report-screen');
        reportElement.classList.add('exporting');
        
        html2canvas(document.getElementById('report-content'), { 
            scale: 2, 
            backgroundColor: "#ffffff",
            useCORS: true
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = currentLang === 'zh' ? '90日財務保衛戰-報告.png' : '90_Days_Finance_Report.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            reportElement.classList.remove('exporting');
        }).catch(err => {
            alert(currentLang === 'zh' ? "截圖生成失敗，請稍後再試。" : "Screenshot failed, please try again.");
            reportElement.classList.remove('exporting');
        });
    }

    // Initialize text on load
    window.onload = () => {
        updateStaticText();
    };
</script>

</body>
</html>
