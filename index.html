/* ===== pixel layer ===== */
/* ===== WiseSpend pixel buddy layer ===== */
:root{--px-ink:#14332c;--px-lime:#d9ed9c;--px-paper:#fffdf4;--px-gold:#efc45c;--px-font:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace}
body{background-image:radial-gradient(#173b340a 1px,transparent 1px);background-size:10px 10px}
.px-svg{display:block;overflow:visible}
.px-idle{animation:px-bob 2.8s steps(2,end) infinite}
@keyframes px-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes px-pop{0%{transform:scale(.55) translateY(5px);opacity:0}60%{transform:scale(1.1) translateY(-2px);opacity:1}100%{transform:scale(1);opacity:1}}
.px-pop{animation:px-pop .35s steps(3,end)}
@keyframes px-spark{0%,100%{transform:translateY(0);opacity:.85}50%{transform:translateY(-4px);opacity:.5}}
@keyframes px-pulse{50%{opacity:.4}}

/* brandmark mascot */
.brandmark.px-brandmark{padding:0;overflow:hidden;display:grid;place-items:center}
.brandmark .px-svg{width:32px;height:32px}

/* mascot sitting on the semester wallet card */
.px-card-buddy{position:absolute;right:22px;bottom:12px;z-index:2;width:80px;pointer-events:none;filter:drop-shadow(0 5px 0 #00000026)}
.px-card-buddy .px-svg{width:80px;height:80px}
.px-deco{position:absolute;pointer-events:none;z-index:1;animation:px-spark 3.4s steps(2,end) infinite;opacity:.85}
.px-deco .px-svg{width:16px;height:16px}
.px-deco.px-s1{right:112px;bottom:86px}
.px-deco.px-s2{right:26px;bottom:104px;animation-delay:1.5s}
.px-deco.px-c1{right:118px;top:28px;opacity:.55;animation-delay:.7s}

/* pixel speech bubble */
.px-bubble{position:relative;display:block;background:var(--px-paper);color:#173b34;border:2px solid var(--px-ink);border-radius:5px;box-shadow:3px 3px 0 #00000022;padding:7px 9px;font-size:11.5px;line-height:1.5;font-weight:650}
.px-bubble:after{content:"";position:absolute;left:-7px;top:50%;margin-top:-4px;width:7px;height:7px;background:var(--px-paper);border-left:2px solid var(--px-ink);border-bottom:2px solid var(--px-ink);transform:rotate(45deg)}

/* in-game sidebar buddy */
.px-side-buddy{margin-top:22px;padding-top:16px;border-top:1px dashed #ffffff30;grid-column:1/-1}
.px-side-top{display:flex;align-items:center;gap:10px}
.px-side-sprite{flex:0 0 auto;filter:drop-shadow(0 4px 0 #00000030)}
.px-side-copy{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;gap:7px}
.px-name{font:700 10px/1 var(--px-font);letter-spacing:1.8px;color:var(--px-lime)}
#pxSideText{min-height:34px}

/* scenario pixel icon */
.px-stage-icon{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;margin-right:2px;flex:0 0 auto;filter:drop-shadow(2px 2px 0 #173b3415)}
.px-stage-icon .px-svg{width:32px;height:32px}

/* feedback modal buddy */
.px-modal-buddy{display:flex;align-items:center;gap:11px;margin:0 0 18px;padding-bottom:15px;border-bottom:1px dashed var(--line)}
.px-modal-sprite{flex:0 0 auto;filter:drop-shadow(0 3px 0 #173b341c)}
.px-modal-buddy .px-bubble{font-size:12px;flex:1}

/* report hero */
.px-report-hero{display:flex;align-items:center;gap:18px;padding:16px 18px;margin:0 0 24px;background:linear-gradient(135deg,#eef5de,#e2edd1);border:2px solid var(--px-ink);border-radius:6px;box-shadow:4px 4px 0 #173b3414;position:relative;overflow:hidden}
.px-report-sprite{flex:0 0 auto;filter:drop-shadow(0 5px 0 #173b3420)}
.px-report-copy{display:flex;flex-direction:column;gap:7px;min-width:0;flex:1 1 auto}
.px-report-copy b{font:700 10.5px/1 var(--px-font);letter-spacing:2px;color:#496b3a}
.px-report-hero .px-bubble{font-size:12.5px}
.px-report-hero:after{content:"";position:absolute;right:20px;top:16px;width:6px;height:6px;background:var(--px-gold);box-shadow:18px 13px 0 var(--px-lime),35px -2px 0 #c95f52,52px 20px 0 #8fc3dd,67px 5px 0 var(--px-gold);opacity:.8;animation:px-spark 3.2s steps(2,end) infinite}

/* chunky pixel-ish controls */
#options-container>button{border:2px solid #d6dfcf!important;border-radius:5px!important;box-shadow:4px 4px 0 #173b3408!important;transition:transform .14s,border-color .14s,box-shadow .14s,background .14s!important}
#options-container>button:hover{border-color:#6b8a57!important;background:#f4f7ec!important;transform:translate(-2px,-2px)!important;box-shadow:6px 6px 0 #173b3414!important}
#options-container>button:active{transform:translate(1px,1px)!important;box-shadow:1px 1px 0 #173b3408!important}
#options-container>button>div:first-child{font-family:var(--px-font);font-weight:700;letter-spacing:1px}
#start-btn{border-radius:6px!important;box-shadow:5px 5px 0 #173b3418!important}
#start-btn:hover{transform:translate(-2px,-2px)!important;box-shadow:7px 7px 0 #173b3418!important}
#start-btn:active{transform:translate(1px,1px)!important;box-shadow:2px 2px 0 #173b3418!important}

/* segmented pixel meters + timeline blocks */
#game-ui>div:first-child .bg-gray-200{border-radius:0!important;height:8px!important}
#budget-bar,#emergency-bar,#stress-bar{border-radius:0!important;height:8px!important;background-image:repeating-linear-gradient(90deg,transparent 0 5px,rgba(23,59,52,.32) 5px 6px)!important}
.timeline{gap:6px!important;align-items:center}
.timeline span{height:8px!important;border-radius:0!important;background:#ffffff22;box-shadow:inset -2px -2px 0 #0000001c}
.timeline span.done{background:var(--px-lime)!important;box-shadow:inset -2px -2px 0 #7d9a48}
.timeline span.now{background:#fff!important;animation:px-pulse 1.1s steps(2,end) infinite}

/* coin burst */
.px-coin-layer{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden}
.px-coin{position:absolute;width:16px;height:16px;will-change:transform,opacity;animation:px-coin 1.15s cubic-bezier(.2,.75,.3,1) forwards}
.px-coin .px-svg{width:16px;height:16px}
@keyframes px-coin{0%{transform:translate(0,0) scale(.7) rotate(0);opacity:0}12%{opacity:1}55%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--rot));opacity:1}100%{transform:translate(calc(var(--dx)*1.15),calc(var(--dy) + 210px)) scale(.75) rotate(calc(var(--rot)*1.5));opacity:0}}

@media(max-width:600px){
  .px-card-buddy{display:none}
  .px-deco{display:none}
  .px-stage-icon{width:28px;height:28px}
  .px-stage-icon .px-svg{width:28px;height:28px}
  .px-side-buddy{margin-top:16px}
  .px-report-hero{gap:12px;padding:14px}
  .px-report-sprite .px-svg{width:64px;height:64px}
  .px-report-hero:after{display:none}
}
@media print{.px-report-hero,.px-coin-layer,.px-deco{display:none!important}body{background-image:none!important}}
@media(prefers-reduced-motion:reduce){.px-coin{display:none}}

const GAME=[{"zh": "開學第一週，你的舊電腦還能用，只是電池不太耐用。課程也提供免費筆記軟件。你打算怎樣準備？", "en": "It's your first week at university. Your old laptop still works, but the battery doesn't last long. Your course also provides free note-taking software. How would you get ready?", "principleZh": "需要、想要與資金分配", "principleEn": "Needs, wants and allocation", "options": [{"id": "A", "zh": "花 $1,800 升級儲存空間和換電池，現在上課用得順手一點", "en": "Spend $1,800 to upgrade the storage and replace the battery, making the laptop easier to use in class", "cost": 1800, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -5, "axes": [-1, -1, 1], "lessonZh": "便利有價值；這次升級會減少可應付其他事情的現金。", "lessonEn": "Convenience has value; this upgrade leaves less cash for other needs."}, {"id": "B", "zh": "花 $300 買充電頭和充電線，始終電池續航都很重要", "en": "Spend $300 on a charger and charging cable; keeping the laptop powered matters", "cost": 300, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -3, "axes": [-1, 1, 1], "lessonZh": "充電設備方便你有插座時補充電力，但不會改善電池本身的續航。", "lessonEn": "A charger helps when a socket is available, but it does not improve the battery itself."}, {"id": "C", "zh": "先用舊電腦和免費軟件，電池的事遲些再算", "en": "Stick with the old laptop and free software; deal with the battery later", "cost": 0, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": 8, "axes": [-1, 1, -1], "lessonZh": "暫緩支出保留現金，但要預留充電安排。", "lessonEn": "Deferring spending preserves cash but requires access to charging."}, {"id": "D", "zh": "先用同學已經整理好的共同筆記，不另外買工具", "en": "Use the shared notes your classmates have already set up; don't buy extra tools", "cost": 0, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": 0, "axes": [1, 0, -1], "lessonZh": "接受現成安排可省錢；仍要確保自己能取得和理解筆記。", "lessonEn": "An existing arrangement saves money; check your access and understanding."}, {"id": "E", "zh": "約同學一起設定免費共同筆記，也商量好怎樣備份", "en": "Set up free shared notes with classmates and agree on how to back them up", "cost": 0, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": 2, "axes": [1, 1, 1], "lessonZh": "協作可減少重複支出，但需要投入協調時間。", "lessonEn": "Collaboration can avoid duplicate spending but takes coordination time."}]}, {"zh": "同學約你吃飯和唱歌，整晚大約要 $500。同一晚也有一更可賺 $200 的兼職邀請，你還沒答應，可以選擇接受或拒絕。平日也有機會見面，這次不一定要去。你會怎樣選？", "en": "Your classmates invite you to dinner and karaoke for about $500. You also have an offer of a part-time shift that evening paying $200. You haven't accepted it yet and can say yes or no. There will be other chances to hang out. What would you do?", "principleZh": "社交預算與界線", "principleEn": "Social budgets and boundaries", "options": [{"id": "A", "zh": "跟朋友原本的安排，吃飯和唱歌都去", "en": "Go along with your friends' plan and join both dinner and karaoke", "cost": 500, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -10, "axes": [1, -1, -1], "lessonZh": "參加本身不是錯；檢查它是否符合你可承擔的娛樂預算。", "lessonEn": "Joining is not inherently wrong; check that it fits your leisure budget."}, {"id": "B", "zh": "這次先不去了，在家休息，下次再約", "en": "Skip this outing, rest at home and catch up with everyone another time", "cost": 0, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -5, "axes": [-1, 0, 1], "lessonZh": "拒絕一次活動不等於切斷社交；清楚表達界線即可。", "lessonEn": "Declining one event does not mean isolation; communicate your boundary."}, {"id": "C", "zh": "答應做兼職賺 $200，這晚不去聚會，把賺到的錢全部放進儲備", "en": "Accept the shift to earn $200, skip the outing and put all the earnings into reserve", "cost": 0, "income": 200, "transfer": 200, "borrow": 0, "fee": 0, "stress": 14, "axes": [-1, 1, 1], "lessonZh": "增加收入也佔用時間；這筆儲備來自工作收入。", "lessonEn": "Extra income takes time; this reserve comes from earnings."}, {"id": "D", "zh": "只去 $250 的晚飯，先跟朋友說好不去唱歌", "en": "Join the $250 dinner only and let your friends know you'll skip karaoke", "cost": 250, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -5, "axes": [1, 0, 1], "lessonZh": "部分參與可兼顧關係與支出上限。", "lessonEn": "Partial participation can balance relationships and a spending limit."}, {"id": "E", "zh": "跟朋友去他提議的 $80 校內活動，留些錢之後用", "en": "Join the $80 campus activity a friend suggested and keep some money for later", "cost": 80, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -5, "axes": [1, 1, -1], "lessonZh": "不必每次由你發起；接受合適的低成本安排也有價值。", "lessonEn": "You need not organize everything; accepting a suitable low-cost plan has value."}]}, {"zh": "糟了，你睡過頭了！今天有小組課堂練習，遲到會錯過一部分，但不是考試。你會怎樣趕回進度？", "en": "You've overslept! There's a group exercise in class today. You'll miss part of it if you're late, but it isn't an exam. What would you do?", "principleZh": "額外成本與後果", "principleEn": "Additional costs and consequences", "options": [{"id": "A", "zh": "花 $160 搭的士，希望趕得上小組練習", "en": "Spend $160 on a taxi and try to make the group exercise", "cost": 160, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -5, "axes": [1, -1, 1], "lessonZh": "這次購買的是時間；要比較時間價值與額外車費。", "lessonEn": "You are buying time; compare its value with the additional fare."}, {"id": "B", "zh": "先留在家，缺課的事遲些再處理", "en": "Stay home for now and deal with the missed class later", "cost": 0, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": 22, "axes": [-1, -1, -1], "lessonZh": "暫時避開不適，可能把要處理的工作留到之後。", "lessonEn": "Avoiding discomfort now may leave more work for later."}, {"id": "C", "zh": "搭 $8 港鐵，通知老師，再約時間補做", "en": "Take the $8 MTR trip, tell your teacher and arrange to catch up", "cost": 8, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": 5, "axes": [-1, 1, 1], "lessonZh": "此處 $8 是指定路程的遊戲票價；補做仍需時間。", "lessonEn": "The $8 is the scenario fare; catching up still takes time."}, {"id": "D", "zh": "搭 $6 巴士，之後按老師的安排看錄影、補做練習", "en": "Take the $6 bus, then use the recording and catch-up plan your teacher provided", "cost": 6, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": 8, "axes": [-1, 1, -1], "lessonZh": "善用現成安排也能補救，但要留意完成期限。", "lessonEn": "Existing support can help; pay attention to its deadline."}, {"id": "E", "zh": "搭 $8 港鐵，跟組員商量怎樣補回自己漏做的部分", "en": "Take the $8 MTR trip and work out with your teammates how you'll catch up on your part", "cost": 8, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": 6, "axes": [1, 1, 1], "lessonZh": "合作補救需要互相同意，並承擔自己的工作。", "lessonEn": "A shared recovery plan requires agreement and your contribution."}]}, {"zh": "期中測驗終於結束，你想放鬆一晚。花錢娛樂也好，不花錢休息也好，你會怎樣安排？", "en": "Mid-term tests are finally over, and you'd like an evening off. You could spend a little or unwind without spending money. What sounds good to you?", "principleZh": "有意識的娛樂支出", "principleEn": "Intentional leisure spending", "options": [{"id": "A", "zh": "買那款想玩很久的 $300 遊戲，今晚自己玩", "en": "Buy the $300 game you have wanted for ages and play it on your own tonight", "cost": 300, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -10, "axes": [-1, -1, 1], "lessonZh": "娛樂可以是有價值的選擇；先定支出上限。", "lessonEn": "Leisure can be worthwhile; set a spending limit first."}, {"id": "B", "zh": "暫時不買，把 $200 放進儲備，今晚找些免費娛樂", "en": "Hold off on buying, put $200 into reserve and find something free to enjoy tonight", "cost": 0, "income": 0, "transfer": 200, "borrow": 0, "fee": 0, "stress": -5, "axes": [-1, 1, 1], "lessonZh": "不購買沒有產生收入；儲備是從原有現金轉入。", "lessonEn": "Not buying generates no income; the reserve comes from existing cash."}, {"id": "C", "zh": "照舊用免費音樂服務，暫時不花時間找其他方案", "en": "Keep using your free music service; don't spend time comparing other plans right now", "cost": 0, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -5, "axes": [-1, 0, -1], "lessonZh": "沿用可用的免費方案，不代表缺乏理財能力。", "lessonEn": "Keeping a workable free option is not a financial failure."}, {"id": "D", "zh": "跟朋友去他們提議的電影和晚飯，花 $220", "en": "Join your friends' film-and-dinner plan for $220", "cost": 220, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -10, "axes": [1, -1, -1], "lessonZh": "為共同體驗付費前，先確認餘下的現金安排。", "lessonEn": "Before paying for a shared experience, check your remaining cash plans."}, {"id": "E", "zh": "約朋友去散步聊天，順便吃個飯，花 $50", "en": "Arrange a walk and chat with friends, then grab a meal for $50", "cost": 50, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -8, "axes": [1, 1, 1], "lessonZh": "低成本社交仍需要大家的時間與意願。", "lessonEn": "Low-cost socializing still requires everyone’s time and interest."}]}, {"zh": "已經晚上十時，小組功課還沒做完，你也餓了。附近還有店舖營業，共用廚房也能用。", "en": "It's 10 pm, the group assignment isn't finished, and you're hungry. Nearby shops are still open, and you can use the shared kitchen.", "principleZh": "便利、時間與基本需要", "principleEn": "Convenience, time and basic needs", "options": [{"id": "A", "zh": "花 $95 叫外賣，邊等邊繼續做自己的部分", "en": "Order $95 delivery and keep working on your part while you wait", "cost": 95, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -5, "axes": [-1, -1, 1], "lessonZh": "便利費可換取時間；需比較今晚的實際需要。", "lessonEn": "A convenience fee can buy time; compare it with tonight’s needs."}, {"id": "B", "zh": "先做功課，吃東西的事遲些再算", "en": "Keep working for now and sort out food later", "cost": 0, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": 25, "axes": [-1, -1, -1], "lessonZh": "延後基本需要可能令工作更難持續；可重新安排休息。", "lessonEn": "Deferring basic needs may make work harder to sustain; plan a break."}, {"id": "C", "zh": "先看看要等多久，再買附近的 $40 優惠餐", "en": "Check how long collection will take, then get the nearby $40 meal deal", "cost": 40, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -3, "axes": [-1, 0, 1], "lessonZh": "優惠有用，但路程及等候時間也是成本。", "lessonEn": "A discount helps, but travel and waiting also cost time."}, {"id": "D", "zh": "跟組員已經安排好的訂餐，自己付 $45", "en": "Join the order your teammates have already arranged and pay your $45 share", "cost": 45, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -5, "axes": [1, 0, -1], "lessonZh": "公平分攤可節省協調時間，先確認每人的費用。", "lessonEn": "Fair cost sharing can save coordination; confirm each person’s share."}, {"id": "E", "zh": "出 $30 買食材，跟同學一起煮麵，之後輪流清潔", "en": "Put $30 towards ingredients, cook noodles with classmates and take turns cleaning up", "cost": 30, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -4, "axes": [1, 1, 1], "lessonZh": "分工可降低金錢支出，但清潔與準備仍需時間。", "lessonEn": "Sharing tasks reduces spending but preparation and cleaning still take time."}]}, {"zh": "你用的訂閱服務明天就要續期，全部續訂共 $180：雲端備份 $60、娛樂服務 $80、筆記工具 $40，現在還沒扣款。校園免費工具已能應付基本學習需要，但你仍要確認備份容量是否夠用。你會留下哪些服務？", "en": "Your subscriptions renew tomorrow for $180 in total: $60 for cloud backup, $80 for entertainment and $40 for note-taking tools. You haven't been charged yet. Free campus tools cover basic study needs, but check whether the backup storage is enough. Which services would you keep?", "principleZh": "續訂檢查與資金轉存", "principleEn": "Renewal checks and reserve transfers", "options": [{"id": "A", "zh": "先照舊續訂全部服務，付 $180，下月總開支還沒細看", "en": "Renew everything for $180 as usual; you haven't checked next month's total spending yet", "cost": 180, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": 12, "axes": [-1, -1, -1], "lessonZh": "未確認後續負擔，可能令資金安排更不確定；這裡的加分是遊戲設定。", "lessonEn": "Unreviewed future commitments add uncertainty to planning; these stress points are illustrative."}, {"id": "B", "zh": "自己看過一遍，確認電腦和免費備份能用後，全部取消", "en": "Review the plans yourself and cancel them all after checking your local and free backups work", "cost": 0, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -4, "axes": [-1, 1, 1], "lessonZh": "取消之前先確認替代方案，避免只看價格。", "lessonEn": "Check alternatives before cancelling rather than looking only at price."}, {"id": "C", "zh": "留下自己需要的 $60 雲端備份，取消其他服務，再把 $120 放進儲備", "en": "Keep the $60 cloud backup you need, cancel the other plans and put $120 into reserve", "cost": 60, "income": 0, "transfer": 120, "borrow": 0, "fee": 0, "stress": -3, "axes": [-1, 1, 1], "lessonZh": "現金減少 $180：$60 是訂閱支出，$120 只是轉入儲備，總資金只減少 $60。", "lessonEn": "Cash falls by $180: $60 is spent on the subscription and $120 moves to reserve. Total funds fall by only $60."}, {"id": "D", "zh": "留下自己常用的 $80 娛樂服務，學習就用免費工具", "en": "Keep the $80 entertainment plan you use and switch to free tools for studying", "cost": 80, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -3, "axes": [-1, -1, 1], "lessonZh": "有使用的娛樂與免費學習工具可以共存；重點是用途和負擔。", "lessonEn": "Used entertainment and free study tools can coexist; consider value and affordability."}, {"id": "E", "zh": "跟室友用他提議的共享服務，每人 $50；服務條款容許共享", "en": "Join the shared plan your roommate suggested for $50 each; the service allows sharing", "cost": 50, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -2, "axes": [1, 1, -1], "lessonZh": "分攤前要核對服務條款、付款責任及退出安排。", "lessonEn": "Before sharing, check terms, payment responsibilities and how to leave."}]}, {"zh": "快到期末了，你還有一星期整理筆記。老師有提供免費教材，不過不論用哪種方法，都要自己核對內容。你會怎樣準備？", "en": "Finals are coming up, and you have a week to get your notes ready. Your teacher provides free materials, but you'll need to check the content whichever approach you choose. How would you prepare?", "principleZh": "時間與學習資源", "principleEn": "Time and learning resources", "options": [{"id": "A", "zh": "花 $200 買合法整理的教材，今晚可以少花點時間整理", "en": "Buy $200 of authorized study materials to save yourself some sorting time tonight", "cost": 200, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -5, "axes": [-1, -1, 1], "lessonZh": "付費可買到整理服務，但不能取代理解與核對。", "lessonEn": "Payment can buy organization, not understanding or verification."}, {"id": "B", "zh": "照舊自己看免費教材，大部分筆記留到最後兩晚才整理", "en": "Keep reading the free materials on your own and leave most note preparation to the last two evenings", "cost": 0, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": 16, "axes": [-1, 1, -1], "lessonZh": "免費教材本身不增加負荷；把大量準備集中到最後兩晚，才是這個選擇的壓力來源。", "lessonEn": "Free materials are not the source of load; concentrating most preparation into two evenings is."}, {"id": "C", "zh": "在課程容許的範圍內，用免費 AI 做溫習卡，再逐項核對", "en": "Use free AI to make flashcards if your course allows it, then check every item", "cost": 0, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": 4, "axes": [-1, 1, 1], "lessonZh": "工具輸出需要核對；時間成本也應計入安排。", "lessonEn": "Tool output requires verification; include that time in your plan."}, {"id": "D", "zh": "跟同學去他邀請你參加的 $120 考前工作坊", "en": "Join the $120 revision workshop a classmate invited you to", "cost": 120, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -6, "axes": [1, -1, -1], "lessonZh": "先查清內容是否符合課程，並比較免費支援。", "lessonEn": "Check course relevance and compare free support before paying."}, {"id": "E", "zh": "約同學組個免費溫習小組，分工整理，再互相核對", "en": "Set up a free study group, split the preparation and check each other’s work", "cost": 0, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": 2, "axes": [1, 1, 1], "lessonZh": "分工能共享資源，但需預留檢查與協調時間。", "lessonEn": "Shared work expands resources but needs checking and coordination."}]}, {"zh": "快到期末，你想多留一點錢應付之後的開支，但也要留時間溫習和休息。校內剛好有一份八小時的工作，做完當天可得 $800，也不會撞課。你會怎樣安排？", "en": "With finals coming up, you'd like some extra money for later expenses, but you also need time to study and rest. There's an eight-hour campus shift available. It pays $800 that day and doesn't clash with classes. What would you do?", "principleZh": "收入、負債與還款", "principleEn": "Income, debt and repayment", "options": [{"id": "A", "zh": "不接工作，先借 $800 周轉，期末還 $840", "en": "Skip the shift and borrow $800 for now; repay $840 at term end", "cost": 0, "income": 0, "transfer": 0, "borrow": 800, "fee": 40, "stress": 14, "axes": [0, -1, -1], "lessonZh": "借款增加現金，也增加負債；$40 是本情境固定費用，非真實產品報價。", "lessonEn": "Borrowing adds cash and debt; $40 is a fictional fixed fee, not a product quote."}, {"id": "B", "zh": "先用手上的錢，不借也不接工作，想買的非必需品遲些再買", "en": "Stick with the money you have, skip borrowing and work, and put off non-essential purchases", "cost": 0, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": 0, "axes": [-1, 1, -1], "lessonZh": "餘額足夠時，不增加收入也是可行選擇。", "lessonEn": "With enough funds, choosing not to earn extra can be reasonable."}, {"id": "C", "zh": "接下工作賺 $800，其中 $500 'use strict';
let lang='zh',state,history=[],pending=null,settled=false,preConfidence=5,postConfidence=5;
const $=id=>document.getElementById(id),T=(z,e)=>lang==='zh'?z:e;
const money=n=>(n<0?'-':'')+'HK$'+Math.abs(n).toLocaleString('en-HK');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PROFILES={"S_F_R":["全方位策略家","The Balanced Strategist"],"S_F_A":["謹慎社交者","The Cautious Socialite"],"S_P_R":["體驗探索家","The Experience Seeker"],"S_P_A":["隨性享樂派","The YOLO Spender"],"I_F_R":["效率精算師","The Ambitious Optimizer"],"I_F_A":["極限生存者","The Extreme Survivor"],"I_P_R":["捷徑投資客","The Productivity Hacker"],"I_P_A":["焦慮逃避者","The Anxious Avoider"]};
const initial=()=>({cash:4000,reserve:0,debt:0,stress:20,axes:[0,0,0],stage:0,reason:'completed'});
function profile(s=state){const mixed=s.axes.some(v=>Math.abs(v)<=1);return {mixed,provisional:history.length<8,key:(s.axes[0]>0?'S':'I')+'_'+(s.axes[1]>=0?'F':'P')+'_'+(s.axes[2]>=0?'R':'A')};}
// Pure money engine: transfers preserve assets; debt includes the stated fixed fee.
function calculate(s,o,useReserve=false){let cash=s.cash+o.income+o.borrow-o.cost-o.transfer,reserve=s.reserve+o.transfer,used=0;
 if(o.reserveFirst){used=Math.min(s.reserve,o.cost);cash+=used;reserve-=used;}
 if(cash<0&&useReserve){const more=Math.min(reserve,-cash);used+=more;cash+=more;reserve-=more;}
 return {cash,reserve,debt:s.debt+o.borrow+o.fee,stress:Math.max(0,Math.min(100,s.stress+o.stress)),axes:s.axes.map((v,i)=>v+o.axes[i]),stage:s.stage,reason:s.reason,used};}
function setText(id,z,e){$(id).textContent=T(z,e);}
function rules(){return T('你扮演已有舊電腦、可使用校園資源的大學生。90 天的基本食宿、日常交通及學費已另作安排；HK$4,000 只用於本遊戲的額外選擇與突發事件。所有價格、工資及壓力點數均為教學設定。','You play a student with an older laptop and access to campus resources. Basic meals, housing, daily travel and tuition for 90 days are covered separately. HK$4,000 covers the extra choices and emergencies in this game. Prices, wages and stress points are illustrative settings.');}
function method(){return T('我們記錄三種取向：個人或群體需要、當下或未來安排、主動調整或沿用／暫緩安排。每個選擇只在有關的軸加 1、減 1 或不加分；總分 −1 至 +1 表示傾向未明顯，不硬分成單一類型。完成少於 8 題只提供初步觀察。這些分界是待試玩的設計設定。這是本次情境的反思工具，不是人格診斷，也沒有好壞排名。','We track personal or group needs, present or future priorities, and initiating changes or using existing/deferring plans. Relevant axes receive +1, −1 or 0 per choice. Totals from −1 to +1 are mixed rather than forced into one type. Fewer than 8 decisions gives preliminary observations only. These cutoffs are design settings awaiting user testing. This reflects this playthrough, not a personality diagnosis or a ranking.');}

 $('start-title').innerHTML=T('大學生存指南<br><span>理財情境與行為反思</span>','Uni Survival Guide<br><span>Choices & financial reflection</span>');
 setText('wallet-title','你的學期錢包','YOUR SEMESTER WALLET');setText('wallet-days','90 天','90 DAYS');setText('wallet-scenes','10 個情境','10 SCENARIOS');setText('wallet-choice','由你選擇','YOUR CHOICE');
 setText('start-intro-title','遊戲設定與規則','Setting & rules');$('start-intro-1').textContent=rules();
 $('start-intro-2').textContent=T('現金與儲備分開記帳，轉存不會增加總資金。借款須於結尾償還本金及已列明費用；結算會先用現金，再用儲備。壓力從 20 開始，達 100 時會提前結束本次挑戰並反思；未必能進入第十題。點數代表教學情境負荷，不代表真實心理狀況。資金不足的選項可以返回重選；有儲備時可自行決定是否動用。','Cash and reserve are separate; transfers do not create money. Loans and stated fees are repaid at the end, using cash then reserve. Stress starts at 20; reaching 100 ends this attempt for reflection, possibly before scenario 10. Points represent illustrative workload, not real mental health. If a choice is unaffordable, choose again or decide whether to use reserve.');
 setText('method-title','遊戲如何判斷你的取向？','How are your tendencies identified?');$('method-copy').textContent=method();
 setText('pre-conf-label','開始前：若電腦突然壞了，你有多大信心處理相關開支？1＝沒有信心，10＝很有信心。','Before playing: how confident are you about handling the cost of a broken laptop? 1 = not confident, 10 = very confident.');
 setText('survey-note','滑桿只記錄在本次頁面，並不自動提交至問卷。請自行完成連結中的問卷；重新整理會清除遊戲紀錄。','Sliders stay in this page only and are not sent to the survey. Complete the linked forms yourself; refreshing clears this playthrough.');
 setText('btn-pre-form','第 1 步：填寫課前問卷 ↗','Step 1: Pre-game survey ↗');setText('start-btn','第 2 步：開始挑戰','Step 2: Start the challenge');
 setText('ui-budget-label','可用現金','Cash');setText('ui-emergency-label','儲備金','Reserve');setText('ui-stress-label','遊戲壓力','Game stress');
 setText('semester-label','學期挑戰 /','THE SEMESTER /');setText('footer','WISESPEND · 理財情境學習','WISESPEND · LEARNING THROUGH CHOICES');
 const j=lang==='zh'?['問卷','挑戰','反思']:['SURVEY','PLAY','REFLECT'];$('journey').innerHTML=j.map((v,i)=>`<div><b>0${i+1} / ${v}</b></div>`).join('');

function toggleLanguage(){lang=lang==='zh'?'en':'zh';updateStatic();if(!$('report-screen').classList.contains('hidden'))renderReport();}
function show(id){$(id).classList.remove('hidden');}function hide(id){$(id).classList.add('hidden');}
function modalOpen(){return !$('feedback-modal').classList.contains('hidden');}
function openModal(title,body,buttons){$('feedback-title').textContent=title;$('feedback-body').innerHTML=body;$('modal-actions').innerHTML='';for(const b of buttons){const el=document.createElement('button');el.textContent=b.label;el.onclick=b.action;el.className='action '+(b.secondary?'secondary':'');$('modal-actions').appendChild(el);}show('feedback-modal');$('game-ui').inert=true;$('modal-actions').querySelector('button').focus();}
function closeModal(){hide('feedback-modal');$('game-ui').inert=false;}
function startGame(){state=initial();history=[];settled=false;pending=null;preConfidence=Number($('pre-conf-slider').value);postConfidence=5;hide('start-screen');hide('report-screen');hide('lang-switcher-container');show('game-ui');updateUI();renderQuestion();}
function updateUI(){$('budget-display').textContent=money(state.cash);$('emergency-display').textContent=money(state.reserve);$('stress-display').textContent=state.stress+' / 100';$('budget-bar').style.width=Math.min(100,Math.max(0,state.cash/4000*100))+'%';$('emergency-bar').style.width=Math.min(100,state.reserve/1500*100)+'%';$('stress-bar').style.width=state.stress+'%';$('stress-bar').style.background=state.stress>=80?'#b5443e':'#83a773';$('debt-status').textContent=T('期末應還：','Due at term end: ')+money(state.debt);$('net-status').textContent=T('淨資金：','Net funds: ')+money(state.cash+state.reserve-state.debt);$('budget-warning').textContent=state.cash<500?T('留意現金餘額','Cash is running low'):'';}
function effect(o){let a=[];if(o.cost)a.push(T('支出 ','Cost ')+money(o.cost));if(o.income)a.push(T('收入 ','Income ')+money(o.income));if(o.transfer)a.push(T('轉存 ','To reserve ')+money(o.transfer));if(o.borrow)a.push(T('借入 ','Borrow ')+money(o.borrow)+T('／期末還 ',' / repay ')+money(o.borrow+o.fee));if(!a.length)a.push(T('無金錢變動','No money movement'));a.push(T('壓力 ','Stress ')+(o.stress>0?'+':'')+o.stress);return a.join(' · ');}
function renderQuestion(){const q=GAME[state.stage];$('stage-indicator').textContent=state.stage===9?T('期末突發事件','TERM-END EVENT'):T('第 ','MONTH ')+(Math.floor(state.stage/3)+1)+T(' 個月','');$('decision-counter').textContent=(state.stage+1)+' / 10';$('question-text').textContent=q[lang];$('context-note').textContent=state.stage===7?T('你目前可用現金為 ','Your current cash is ')+money(state.cash)+T('。請按自己的需要決定。','. Decide based on your needs.'):'';
 $('timeline').innerHTML=GAME.map((_,i)=>`<span class="${i<state.stage?'done':i===state.stage?'now':''}"></span>`).join('');
 $('options-container').innerHTML='';q.options.forEach((o,i)=>{const btn=document.createElement('button');btn.innerHTML=`<div>${T('選項','Option')} ${o.id}</div><div>${esc(o[lang])}<small class="effects">${esc(effect(o))}</small></div>`;btn.onclick=()=>selectOption(i);$('options-container').appendChild(btn);});window.scrollTo(0,0);}
function selectOption(i){if(modalOpen()||state.stage>=GAME.length)return;const o=GAME[state.stage].options[i],n=calculate(state,o);pending=i;
 if(n.cash<0){const possible=n.cash+n.reserve>=0;openModal(T('先檢查可用資金','Check available funds'),`<p>${possible?T('這個選擇需要額外動用儲備 ','This choice needs a reserve withdrawal of ')+money(-n.cash):T('現金與儲備合計不足，請選另一個安排。','Cash and reserve together are insufficient. Choose another arrangement.')}</p>`,[...(possible?[{label:T('確認動用儲備','Use reserve'),action:()=>commitChoice(i,true)}]:[]),{label:T('返回選項','Choose again'),secondary:true,action:()=>{closeModal();pending=null;$('options-container').querySelector('button').focus();}}]);return;}
 commitChoice(i,false);}
function commitChoice(i,useReserve){const q=GAME[state.stage],o=q.options[i],before=structuredClone(state),n=calculate(state,o,useReserve);if(n.cash<0||n.reserve<0)throw Error('Invalid funding');state=n;history.push({stage:state.stage,option:o.id,before,after:structuredClone(state),used:n.used});pending=null;updateUI();const changes=[['現金','Cash',n.cash-before.cash],['儲備','Reserve',n.reserve-before.reserve],['應還款','Amount owed',n.debt-before.debt],['壓力','Stress',n.stress-before.stress]];
 openModal(T('你的選擇 / ','Your choice / ')+o.id,`<p class="quote">${esc(o[lang])}</p><div class="lesson"><small>${esc(T(q.principleZh,q.principleEn))}</small><p>${esc(T(o.lessonZh,o.lessonEn))}</p></div><div class="changes">${changes.map((x,j)=>`<div>${T(x[0],x[1])}<b>${j===3?(x[2]>0?'+':'')+x[2]:(x[2]>0?'+':'')+money(x[2])}</b></div>`).join('')}</div>${n.used?'<p>'+T('本次動用儲備：','Reserve used: ')+money(n.used)+'</p>':''}<p class="muted">${T('實際壓力：','Actual stress: ')}${before.stress} → ${n.stress}${n.stress===100?T('。已達暫停門檻。','. Pause threshold reached.'):''}</p>`,[{label:n.stress===100?T('暫停並查看報告','Pause and view report'):state.stage===9?T('期末結算及報告','Settle and view report'):T('繼續下一階段','Continue'),action:nextStage}]);}
function nextStage(){closeModal();if(state.stress>=100){state.reason='stress';finish();return;}state.stage++;if(state.stage===GAME.length)finish();else if(state.stage===9){openModal(T('🚨 突發情況！','🚨 Emergency!'),'<p class="emergency-emoji" aria-hidden="true">🚨</p><p>'+T('糟了，你的電腦突然壞了！還有功課要交，先看看可以怎樣處理。',"Your laptop has suddenly stopped working! You have an assignment due—let’s see what you can do.")+'</p>',[{label:T('面對突發情況','Continue to the emergency'),action:()=>{closeModal();renderQuestion();$('options-container').querySelector('button').focus();}}]);}else{renderQuestion();$('options-container').querySelector('button').focus();}}
let settlement={paid:0,remaining:0};
function finish(){if(!settled){const due=state.debt,payCash=Math.min(state.cash,due),payReserve=Math.min(state.reserve,due-payCash);state.cash-=payCash;state.reserve-=payReserve;state.debt-=payCash+payReserve;settlement={due,paid:payCash+payReserve,fromReserve:payReserve,remaining:state.debt};settled=true;if(state.debt>0&&state.reason==='completed')state.reason='shortfall';}hide('game-ui');show('report-screen');show('lang-switcher-container');renderReport();window.scrollTo(0,0);}
function signed(v){return (v>0?'+':'')+v;}
function axisName(i){return T(['需要對象','時間安排','應對方式'][i],['Needs focus','Time priorities','Response approach'][i]);}
function axisSide(i,value){const n=[['個人需要','群體需要','Personal needs','Group needs'],['當下安排','未來安排','Present priorities','Future priorities'],['沿用／暫緩','主動調整','Existing/deferred plans','Initiating changes']][i];return T(n[value>0?1:0],n[value>0?3:2]);}
function axisDescription(i,value){return Math.abs(value)<=1?T('未呈現明確單一方向','No clear single direction'):T('傾向：','Leaning toward: ')+axisSide(i,value);}
function axisExplanation(i,value){const ds=dimensionData(i);return ds.interpretation;}
function profileTitle(){const p=profile();return p.provisional?T('初步結果：選擇紀錄尚不足','Preliminary result: not enough choices'):p.mixed?T('混合取向：單一類型未能概括本次選擇','Mixed result: no single archetype captures these choices'):PROFILES[p.key][lang==='zh'?0:1];}
function profileIntro(){const p=profile(),n=state.axes.filter(v=>Math.abs(v)<=1).length;
 if(p.provisional)return T(`目前記錄了 ${history.length} 個選擇，未達 8 題門檻，因此暫不分類。分數只描述已記錄的選擇，不能當作混合取向或固定性格的證據。`,`Only ${history.length} choices are recorded, below the 8-choice threshold. No type is assigned. Scores describe those choices only; they do not establish a mixed profile or a fixed personality.`);
 if(p.mixed)return T(`三個面向中有 ${n} 個分數介乎 −1 至 +1，未呈現明確單一方向，因此不硬配八種類型之一。這是有效結果，不是錯誤或未完成；不同面向的選擇未必適合用單一標籤概括。`,`In ${n} of the three dimensions, the score is between −1 and +1, with no clear single direction. We therefore do not force a match to the eight archetypes. This is a valid result, not an error or an incomplete result; one label may not capture your choices across dimensions.`);
 return T('三個面向的分數均超出 −1 至 +1，按原有三軸方向組合得到此類型。它只概括本次選擇，並非固定人格或能力排名。','All three scores fall outside −1 to +1. Their directions produce this archetype under the existing rules. It summarises this playthrough, not a fixed personality or a ranking of ability.');
}
function recordedChoices(){return history.map(h=>({h,o:GAME[h.stage].options.find(o=>o.id===h.option)}));}
function dimensionData(i){const v=state.axes[i],rows=recordedChoices(),pos=rows.filter(r=>r.o.axes[i]>0),neg=rows.filter(r=>r.o.axes[i]<0),zero=rows.length-pos.length-neg.length,unclear=Math.abs(v)<=1;
 const interpretation=unclear?(pos.length+neg.length===0?T('本軸沒有非零評分選擇，資料尚未呈現方向；不能推斷你平衡或靈活。','No recorded choice contributed a non-zero score here. There is no directional evidence; this does not establish balance or flexibility.'):T('正負分相抵或方向證據較少，未呈現明確單一方向。可回看情境差異；不能單憑總分推斷你平衡或靈活。','Opposing scores offset or directional evidence is limited. No clear single direction is established. Review the contexts; the total alone does not establish balance or flexibility.')):T(`本次加總較偏向「${axisSide(i,v)}」，但不表示每次都選同一方向。`,`The total leans toward ${axisSide(i,v).toLowerCase()}, but this does not mean every choice followed that direction.`);
 const evidence=unclear?[pos[0],neg[0]].filter(Boolean):(v>0?pos:neg).slice(-1);if(!evidence.length&&rows.length)evidence.push(rows[0]);
 const advice=[
 unclear?T('個人與群體需要都曾影響選擇；先訂必要開支，再分配兩類預算。','Personal and group needs can compete. Cover essentials, then set limits for both.'):(v>0?T('群體需要較多；留意社交開支擠壓個人必要開支，先訂聚會上限。','Group needs led more often. Set a social limit so personal essentials remain funded.'):T('個人需要較多；比較個人購買與共享方案的總成本，再決定。','Personal needs led more often. Compare individual purchases with workable shared options.')),
 unclear?T('當下與未來取向未分明；列出本週及下月費用，避免遺漏後續負擔。','No clear time direction. List this week’s and next month’s costs to catch later commitments.'):(v>0?T('較重視未來；儲備目標也要留出當下基本需要，避免只追求低支出。','Future priorities led. Keep room for current basic needs alongside reserve goals.'):T('較重視當下；先查下次到期費用，再決定這次可用多少。','Present priorities led. Check upcoming bills before deciding what is available now.')),
 unclear?T('應對方向未分明；挑一項待辦，訂處理期限並確認可用支援。','No clear response direction. Give one unresolved task a deadline and check available support.'):(v>0?T('主動調整較多；把協調和準備時間也算作成本，保留可行後備方案。','Initiating changes led. Count coordination time as a cost and keep a workable backup.'):T('沿用或暫緩較多；不代表逃避，但應為未完成事項訂跟進期限。','Existing/deferred plans led; this is not proof of avoidance. Set follow-up dates for unfinished tasks.'))][i];
 return {i,name:axisName(i),score:v,direction:axisDescription(i,v),positive:pos.length,negative:neg.length,zero,unclear,interpretation,evidence:evidence.map(({h,o})=>({stage:h.stage+1,option:o.id,delta:o.axes[i],choice:o[lang]})),advice};

function coinBurst(n){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  let layer=q('#pxCoinLayer');
  if(!layer){layer=document.createElement('div');layer.id='pxCoinLayer';layer.className='px-coin-layer';layer.setAttribute('aria-hidden','true');document.body.appendChild(layer);}
  const r=q('#pxSideBuddy')?q('#pxSideBuddy').getBoundingClientRect():null;
  const x=r?r.left+r.width/2:window.innerWidth/2, y=r?r.top+24:window.innerHeight/2;
  for(let i=0;i<n;i++){
    const c=document.createElement('span');c.className='px-coin';c.innerHTML=sprite(COIN,16);
    c.style.left=x+'px';c.style.top=y+'px';
    c.style.setProperty('--dx',(Math.random()*180-90).toFixed(0)+'px');
    c.style.setProperty('--dy',(-70-Math.random()*150).toFixed(0)+'px');
    c.style.setProperty('--rot',(Math.random()*360-180).toFixed(0)+'deg');
    c.style.animationDelay=(i*32)+'ms';
    layer.appendChild(c);
    window.setTimeout(function(){c.remove();},1500);
  }
}

        box.insertBefore(d,box.firstChild);
      }
      const t=String(title||'');
      if(/🚨|突發|Emergency/i.test(t))setModal('panic',pickLine('panic'));
      else if(/資金|funds/i.test(t))setModal('worry',pickLine('worry'));
      else setModal('chill',pickLine('chill'));
    }
  }catch(e){console.warn('pixel openModal',e);}
  return r;
};
const _commitChoice=window.commitChoice;
if(typeof _commitChoice==='function')window.commitChoice=function(){
  const before=meters();
  const r=_commitChoice.apply(this,arguments);
  try{
    const a=meters(),dc=a.cash-before.cash,ds=a.stress-before.stress,dd=a.debt-before.debt;
    let mood='happy',kind='happy';
    if(dd>0){mood='worry';kind='debt';}
    else if(a.stress>=80){mood='panic';kind='tired';}
    else if(a.cash<500){mood='panic';kind='panic';}
    else if(ds>=10){mood='worry';kind='stress';}
    else if(dc<=-500){mood='worry';kind='worry';}
    else if(dc>0){mood='proud';kind='income';}
    else if(ds<0){mood='happy';kind='happy';}
    else if(dc<0){mood='chill';kind='chill';}
    const line=pickLine(kind);
    setSide(mood,line,true);setModal(mood,line);
    if(dc<0)coinBurst(Math.max(3,Math.min(10,Math.round(-dc/120))));
    window.clearTimeout(ambientTimer);
    ambientTimer=window.setTimeout(function(){const m=meters(),mk=moodFor(m);setSide(mk[0],pickLine(mk[1]),false);},8000);
  }catch(e){console.warn('pixel commitChoice',e);}
  return r;
};
const _renderReport=window.renderReport;
if(typeof _renderReport==='function')window.renderReport=function(){
  const r=_renderReport.apply(this,arguments);
  try{
    const content=q('#report-content');if(!content)return r;
    const stats=qa('.report-stats>div',content);
    const statVal=function(re){const d=stats.filter(function(x){return re.test(x.textContent);})[0];return d?firstNum(d.textContent):0;};
    const stress=statVal(/遊戲壓力|Game stress/),owed=statVal(/仍欠|Still owed/);
    let mood='proud',kind='proud';
    if(stress>=80){mood='sad';kind='tired';}
    else if(owed>0){mood='worry';kind='debt';}
    let hero=q('.px-report-hero',content);
    if(!hero){hero=document.createElement('div');hero.className='px-report-hero';hero.setAttribute('aria-hidden','true');content.insertBefore(hero,content.firstChild);}
    hero.dataset.mood=mood;
    hero.innerHTML='<span class="px-report-sprite">'+mascot(mood,80,'px-idle')+'</span><span class="px-report-copy"><b>WISE 仔 · '+(isEn()?'SEMESTER COMPLETE':'學期完成')+'</b><span class="px-bubble">'+pickLine(kind)+'</span></span>';
  }catch(e){console.warn('pixel renderReport',e);}
  return r;
};
const _toggleLanguage=window.toggleLanguage;
if(typeof _toggleLanguage==='function')window.toggleLanguage=function(){
  const r=_toggleLanguage.apply(this,arguments);
  try{const m=meters(),mk=moodFor(m);setSide(mk[0],pickLine(mk[1]),false);}catch(e){}
  return r;
};

ensureUI();
try{const m=meters(),mk=moodFor(m);setSide(mk[0],pickLine(mk[1]),false);}catch(e){}
})();
</script>
