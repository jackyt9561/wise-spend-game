const GAME=[{"zh": "開學第一週，你的舊電腦還能用，只是電池不太耐用。課程也提供免費筆記軟件。你打算怎樣準備？", "en": "It's your first week at university. Your old laptop still works, but the battery doesn't last long. Your course also provides free note-taking software. How would you get ready?", "principleZh": "需要、想要與資金分配", "principleEn": "Needs, wants and allocation", "options": [{"id": "A", "zh": "花 $1,800 升級儲存空間、買些配件，現在上課用得順手一點", "en": "Spend $1,800 on more storage and accessories to make the laptop easier to use now", "cost": 1800, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -5, "axes": [-1, -1, 1], "lessonZh": "便利有價值；這次升級會減少可應付其他事情的現金。", "lessonEn": "Convenience has value; this upgrade leaves less cash for other needs."}, {"id": "B", "zh": "花 $300 換電池，再把 $500 放進儲備", "en": "Replace the battery for $300 and put $500 into reserve", "cost": 300, "income": 0, "transfer": 500, "borrow": 0, "fee": 0, "stress": -3, "axes": [-1, 1, 1], "lessonZh": "維修與轉存是兩回事：總資金只減少維修費。", "lessonEn": "Repair is an expense; a reserve transfer does not change total funds."}, {"id": "C", "zh": "先用舊電腦和免費軟件，電池的事遲些再算", "en": "Stick with the old laptop and free software; deal with the battery later", "cost": 0, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": 8, "axes": [-1, 1, -1], "lessonZh": "暫緩支出保留現金，但要預留充電安排。", "lessonEn": "Deferring spending preserves cash but requires access to charging."}, {"id": "D", "zh": "先用同學已經整理好的共同筆記，不另外買工具", "en": "Use the shared notes your classmates have already set up; don't buy extra tools", "cost": 0, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": 0, "axes": [1, 0, -1], "lessonZh": "接受現成安排可省錢；仍要確保自己能取得和理解筆記。", "lessonEn": "An existing arrangement saves money; check your access and understanding."}, {"id": "E", "zh": "約同學一起設定免費共同筆記，也商量好怎樣備份", "en": "Set up free shared notes with classmates and agree on how to back them up", "cost": 0, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": 2, "axes": [1, 1, 1], "lessonZh": "協作可減少重複支出，但需要投入協調時間。", "lessonEn": "Collaboration can avoid duplicate spending but takes coordination time."}]}, {"zh": "同學約你吃飯和唱歌，整晚大約要 $500。平日也有機會見面，這次不一定要去。你會怎樣選？", "en": "Your classmates invite you to dinner and karaoke. The evening will cost about $500. You'll have other chances to hang out, so you don't have to join this time. What would you do?", "principleZh": "社交預算與界線", "principleEn": "Social budgets and boundaries", "options": [{"id": "A", "zh": "跟朋友原本的安排，吃飯和唱歌都去", "en": "Go along with your friends' plan and join both dinner and karaoke", "cost": 500, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -10, "axes": [1, -1, -1], "lessonZh": "參加本身不是錯；檢查它是否符合你可承擔的娛樂預算。", "lessonEn": "Joining is not inherently wrong; check that it fits your leisure budget."}, {"id": "B", "zh": "這次先不去了，在家休息，下次再約", "en": "Skip this outing, rest at home and catch up with everyone another time", "cost": 0, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -5, "axes": [-1, 0, 1], "lessonZh": "拒絕一次活動不等於切斷社交；清楚表達界線即可。", "lessonEn": "Declining one event does not mean isolation; communicate your boundary."}, {"id": "C", "zh": "去做那更已確認的兼職，賺到的 $200 全部放進儲備", "en": "Take the confirmed part-time shift and put the $200 you earn into reserve", "cost": 0, "income": 200, "transfer": 200, "borrow": 0, "fee": 0, "stress": 14, "axes": [-1, 1, 1], "lessonZh": "增加收入也佔用時間；這筆儲備來自工作收入。", "lessonEn": "Extra income takes time; this reserve comes from earnings."}, {"id": "D", "zh": "只去 $250 的晚飯，先跟朋友說好不去唱歌", "en": "Join the $250 dinner only and let your friends know you'll skip karaoke", "cost": 250, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -5, "axes": [1, 0, 1], "lessonZh": "部分參與可兼顧關係與支出上限。", "lessonEn": "Partial participation can balance relationships and a spending limit."}, {"id": "E", "zh": "跟朋友去他提議的 $80 校內活動，留些錢之後用", "en": "Join the $80 campus activity a friend suggested and keep some money for later", "cost": 80, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -5, "axes": [1, 1, -1], "lessonZh": "不必每次由你發起；接受合適的低成本安排也有價值。", "lessonEn": "You need not organize everything; accepting a suitable low-cost plan has value."}]}, {"zh": "糟了，你睡過頭了！今天有小組課堂練習，遲到會錯過一部分，但不是考試。你會怎樣趕回進度？", "en": "You've overslept! There's a group exercise in class today. You'll miss part of it if you're late, but it isn't an exam. What would you do?", "principleZh": "額外成本與後果", "principleEn": "Additional costs and consequences", "options": [{"id": "A", "zh": "花 $160 搭的士，希望趕得上小組練習", "en": "Spend $160 on a taxi and try to make the group exercise", "cost": 160, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -5, "axes": [1, -1, 1], "lessonZh": "這次購買的是時間；要比較時間價值與額外車費。", "lessonEn": "You are buying time; compare its value with the additional fare."}, {"id": "B", "zh": "先留在家，缺課的事遲些再處理", "en": "Stay home for now and deal with the missed class later", "cost": 0, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": 22, "axes": [-1, -1, -1], "lessonZh": "暫時避開不適，可能把要處理的工作留到之後。", "lessonEn": "Avoiding discomfort now may leave more work for later."}, {"id": "C", "zh": "搭 $8 港鐵，通知老師，再約時間補做", "en": "Take the $8 MTR trip, tell your teacher and arrange to catch up", "cost": 8, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": 5, "axes": [-1, 1, 1], "lessonZh": "此處 $8 是指定路程的遊戲票價；補做仍需時間。", "lessonEn": "The $8 is the scenario fare; catching up still takes time."}, {"id": "D", "zh": "搭 $6 巴士，之後按老師的安排看錄影、補做練習", "en": "Take the $6 bus, then use the recording and catch-up plan your teacher provided", "cost": 6, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": 8, "axes": [-1, 1, -1], "lessonZh": "善用現成安排也能補救，但要留意完成期限。", "lessonEn": "Existing support can help; pay attention to its deadline."}, {"id": "E", "zh": "搭 $8 港鐵，跟組員商量怎樣補回自己漏做的部分", "en": "Take the $8 MTR trip and work out with your teammates how you'll catch up on your part", "cost": 8, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": 6, "axes": [1, 1, 1], "lessonZh": "合作補救需要互相同意，並承擔自己的工作。", "lessonEn": "A shared recovery plan requires agreement and your contribution."}]}, {"zh": "期中評核終於結束，你想放鬆一晚。花錢娛樂也好，免費休息也好，你會怎樣安排？", "en": "Mid-term assessments are finally over, and you'd like an evening off. You could spend a little or relax for free. What sounds good to you?", "principleZh": "有意識的娛樂支出", "principleEn": "Intentional leisure spending", "options": [{"id": "A", "zh": "買那款想玩很久的 $300 遊戲，今晚自己玩", "en": "Buy the $300 game you have wanted for ages and play it on your own tonight", "cost": 300, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -10, "axes": [-1, -1, 1], "lessonZh": "娛樂可以是有價值的選擇；先定支出上限。", "lessonEn": "Leisure can be worthwhile; set a spending limit first."}, {"id": "B", "zh": "暫時不買，把 $200 放進儲備，今晚找些免費娛樂", "en": "Hold off on buying, put $200 into reserve and find something free to enjoy tonight", "cost": 0, "income": 0, "transfer": 200, "borrow": 0, "fee": 0, "stress": -5, "axes": [-1, 1, 1], "lessonZh": "不購買沒有產生收入；儲備是從原有現金轉入。", "lessonEn": "Not buying generates no income; the reserve comes from existing cash."}, {"id": "C", "zh": "照舊用免費音樂服務，暫時不花時間找其他方案", "en": "Keep using your free music service; don't spend time comparing other plans right now", "cost": 0, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -5, "axes": [-1, 0, -1], "lessonZh": "沿用可用的免費方案，不代表缺乏理財能力。", "lessonEn": "Keeping a workable free option is not a financial failure."}, {"id": "D", "zh": "跟朋友去他們提議的電影和晚飯，花 $220", "en": "Join your friends' film-and-dinner plan for $220", "cost": 220, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -10, "axes": [1, -1, -1], "lessonZh": "為共同體驗付費前，先確認餘下的現金安排。", "lessonEn": "Before paying for a shared experience, check your remaining cash plans."}, {"id": "E", "zh": "約朋友免費散步聊天，把錢留到下個月", "en": "Arrange a free walk and chat with friends and keep the money for next month", "cost": 0, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -8, "axes": [1, 1, 1], "lessonZh": "低成本社交仍需要大家的時間與意願。", "lessonEn": "Low-cost socializing still requires everyone’s time and interest."}]}, {"zh": "已經晚上十時，小組功課還沒做完，你也餓了。附近還有店舖營業，共用廚房也能用。", "en": "It's 10 pm, the group assignment isn't finished, and you're hungry. Nearby shops are still open, and you can use the shared kitchen.", "principleZh": "便利、時間與基本需要", "principleEn": "Convenience, time and basic needs", "options": [{"id": "A", "zh": "花 $95 叫外賣，邊等邊繼續做自己的部分", "en": "Order $95 delivery and keep working on your part while you wait", "cost": 95, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -5, "axes": [-1, -1, 1], "lessonZh": "便利費可換取時間；需比較今晚的實際需要。", "lessonEn": "A convenience fee can buy time; compare it with tonight’s needs."}, {"id": "B", "zh": "先做功課，吃東西的事遲些再算", "en": "Keep working for now and sort out food later", "cost": 0, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": 25, "axes": [-1, -1, -1], "lessonZh": "延後基本需要可能令工作更難持續；可重新安排休息。", "lessonEn": "Deferring basic needs may make work harder to sustain; plan a break."}, {"id": "C", "zh": "先看看要等多久，再買附近的 $40 優惠餐", "en": "Check how long collection will take, then get the nearby $40 meal deal", "cost": 40, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -3, "axes": [-1, 0, 1], "lessonZh": "優惠有用，但路程及等候時間也是成本。", "lessonEn": "A discount helps, but travel and waiting also cost time."}, {"id": "D", "zh": "跟組員已經安排好的訂餐，自己付 $45", "en": "Join the order your teammates have already arranged and pay your $45 share", "cost": 45, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -5, "axes": [1, 0, -1], "lessonZh": "公平分攤可節省協調時間，先確認每人的費用。", "lessonEn": "Fair cost sharing can save coordination; confirm each person’s share."}, {"id": "E", "zh": "出 $30 買食材，跟同學一起煮麵，之後輪流清潔", "en": "Put $30 towards ingredients, cook noodles with classmates and take turns cleaning up", "cost": 30, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -4, "axes": [1, 1, 1], "lessonZh": "分工可降低金錢支出，但清潔與準備仍需時間。", "lessonEn": "Sharing tasks reduces spending but preparation and cleaning still take time."}]}, {"zh": "你用的訂閱服務明天就要續期，現在還沒扣款。校園提供的免費工具已經能應付基本學習需要。你會留下哪些服務？", "en": "Your subscriptions renew tomorrow, and you haven't been charged yet. Free campus tools already cover your basic study needs. Which services would you keep?", "principleZh": "續訂檢查與資金轉存", "principleEn": "Renewal checks and reserve transfers", "options": [{"id": "A", "zh": "先照舊續訂全部服務，付 $180，下月總開支還沒細看", "en": "Renew everything for $180 as usual; you haven't checked next month's total spending yet", "cost": 180, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": 12, "axes": [-1, -1, -1], "lessonZh": "未確認後續負擔，可能令資金安排更不確定；這裡的加分是遊戲設定。", "lessonEn": "Unreviewed future commitments add uncertainty to planning; these stress points are illustrative."}, {"id": "B", "zh": "自己看過一遍，確認電腦和免費備份能用後，全部取消", "en": "Review the plans yourself and cancel them all after checking your local and free backups work", "cost": 0, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -4, "axes": [-1, 1, 1], "lessonZh": "取消之前先確認替代方案，避免只看價格。", "lessonEn": "Check alternatives before cancelling rather than looking only at price."}, {"id": "C", "zh": "留下需要的 $60 服務，其他取消，再把 $100 放進儲備", "en": "Keep the $60 service you need, cancel the rest and put $100 into reserve", "cost": 60, "income": 0, "transfer": 100, "borrow": 0, "fee": 0, "stress": -3, "axes": [-1, 1, 1], "lessonZh": "現金減少 $160；其中 $100 仍屬於你的儲備。", "lessonEn": "Cash falls by $160; $100 of that remains yours in reserve."}, {"id": "D", "zh": "留下自己常用的 $80 娛樂服務，學習就用免費工具", "en": "Keep the $80 entertainment plan you use and switch to free tools for studying", "cost": 80, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -3, "axes": [-1, -1, 1], "lessonZh": "有使用的娛樂與免費學習工具可以共存；重點是用途和負擔。", "lessonEn": "Used entertainment and free study tools can coexist; consider value and affordability."}, {"id": "E", "zh": "跟室友用他提議的共享服務，每人 $50；服務條款容許共享", "en": "Join the shared plan your roommate suggested for $50 each; the service allows sharing", "cost": 50, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -2, "axes": [1, 1, -1], "lessonZh": "分攤前要核對服務條款、付款責任及退出安排。", "lessonEn": "Before sharing, check terms, payment responsibilities and how to leave."}]}, {"zh": "快到期末了，你還有一星期整理筆記。老師有提供免費教材，不過不論用哪種方法，都要自己核對內容。你會怎樣準備？", "en": "Finals are coming up, and you have a week to get your notes ready. Your teacher provides free materials, but you'll need to check the content whichever approach you choose. How would you prepare?", "principleZh": "時間與學習資源", "principleEn": "Time and learning resources", "options": [{"id": "A", "zh": "花 $200 買合法整理的教材，今晚可以少花點時間整理", "en": "Buy $200 of authorized study materials to save yourself some sorting time tonight", "cost": 200, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -5, "axes": [-1, -1, 1], "lessonZh": "付費可買到整理服務，但不能取代理解與核對。", "lessonEn": "Payment can buy organization, not understanding or verification."}, {"id": "B", "zh": "照舊自己看免費教材，大部分筆記留到最後兩晚才整理", "en": "Keep reading the free materials on your own and leave most note preparation to the last two evenings", "cost": 0, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": 16, "axes": [-1, 1, -1], "lessonZh": "免費教材本身不增加負荷；把大量準備集中到最後兩晚，才是這個選擇的壓力來源。", "lessonEn": "Free materials are not the source of load; concentrating most preparation into two evenings is."}, {"id": "C", "zh": "在課程容許的範圍內，用免費 AI 做溫習卡，再逐項核對", "en": "Use free AI to make flashcards if your course allows it, then check every item", "cost": 0, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": 4, "axes": [-1, 1, 1], "lessonZh": "工具輸出需要核對；時間成本也應計入安排。", "lessonEn": "Tool output requires verification; include that time in your plan."}, {"id": "D", "zh": "跟同學去他邀請你參加的 $120 考前工作坊", "en": "Join the $120 revision workshop a classmate invited you to", "cost": 120, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -6, "axes": [1, -1, -1], "lessonZh": "先查清內容是否符合課程，並比較免費支援。", "lessonEn": "Check course relevance and compare free support before paying."}, {"id": "E", "zh": "約同學組個免費溫習小組，分工整理，再互相核對", "en": "Set up a free study group, split the preparation and check each other’s work", "cost": 0, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": 2, "axes": [1, 1, 1], "lessonZh": "分工能共享資源，但需預留檢查與協調時間。", "lessonEn": "Shared work expands resources but needs checking and coordination."}]}, {"zh": "快到期末，你想多留一點錢應付之後的開支，但也要留時間溫習和休息。校內剛好有一份八小時的工作，做完當天可得 $800，也不會撞課。你會怎樣安排？", "en": "With finals coming up, you'd like some extra money for later expenses, but you also need time to study and rest. There's an eight-hour campus shift available. It pays $800 that day and doesn't clash with classes. What would you do?", "principleZh": "收入、負債與還款", "principleEn": "Income, debt and repayment", "options": [{"id": "A", "zh": "不接工作，先借 $800 周轉，期末還 $840", "en": "Skip the shift and borrow $800 for now; repay $840 at term end", "cost": 0, "income": 0, "transfer": 0, "borrow": 800, "fee": 40, "stress": 14, "axes": [0, -1, -1], "lessonZh": "借款增加現金，也增加負債；$40 是本情境固定費用，非真實產品報價。", "lessonEn": "Borrowing adds cash and debt; $40 is a fictional fixed fee, not a product quote."}, {"id": "B", "zh": "先用手上的錢，不借也不接工作，想買的非必需品遲些再買", "en": "Stick with the money you have, skip borrowing and work, and put off non-essential purchases", "cost": 0, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": 0, "axes": [-1, 1, -1], "lessonZh": "餘額足夠時，不增加收入也是可行選擇。", "lessonEn": "With enough funds, choosing not to earn extra can be reasonable."}, {"id": "C", "zh": "接下工作賺 $800，其中 $500 放進儲備", "en": "Take the shift, earn $800 and put $500 into reserve", "cost": 0, "income": 800, "transfer": 500, "borrow": 0, "fee": 0, "stress": 18, "axes": [-1, 1, 1], "lessonZh": "現金增加 $300，儲備增加 $500；工作也佔用休息時間。", "lessonEn": "Cash rises $300 and reserve $500; work also uses rest time."}, {"id": "D", "zh": "接受朋友借出的 $500，記下期末要還 $500", "en": "Accept the $500 a friend offers to lend you and note that you owe $500 at term end", "cost": 0, "income": 0, "transfer": 0, "borrow": 500, "fee": 0, "stress": 4, "axes": [1, 0, -1], "lessonZh": "即使無利息，也需要保留還款資金。", "lessonEn": "An interest-free loan still needs a repayment plan."}, {"id": "E", "zh": "跟同學一起接工作賺 $800，先商量好溫習時間", "en": "Take the shift with a classmate to earn $800 and work out your study times together", "cost": 0, "income": 800, "transfer": 0, "borrow": 0, "fee": 0, "stress": 18, "axes": [1, 0, 1], "lessonZh": "一起工作也需要各自完成八小時；收入增加 $800，但仍要預留溫習及休息時間。", "lessonEn": "Each person still works eight hours. You gain $800 but must protect revision and rest time."}]}, {"zh": "晚上十時了，你已經連續幾晚睡不夠。自己的功課和一份小組功課都要在明天下午五時前完成。明早有時間做，但還沒安排好進度。今晚你會怎樣做？", "en": "It's 10 pm, and you haven't had enough sleep for several nights. Your own assignment and a group assignment are both due tomorrow at 5 pm. You have tomorrow morning free, but haven't worked out a plan yet. What would you do tonight?", "principleZh": "休息與便利消費", "principleEn": "Rest and convenience spending", "options": [{"id": "A", "zh": "花 $60 買咖啡和小食，照原本計劃再做一會", "en": "Buy $60 of coffee and snacks and keep working a bit longer as planned", "cost": 60, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": 22, "axes": [-1, -1, -1], "lessonZh": "提神支出不等於補回休息；留意原定計劃是否仍合適。", "lessonEn": "Spending on alertness does not replace rest; reconsider the plan."}, {"id": "B", "zh": "先停下來休息，明天再想怎樣追進度", "en": "Stop and rest now; work out how to catch up tomorrow", "cost": 0, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -8, "axes": [-1, 0, -1], "lessonZh": "休息是合理需要；之後仍要安排未完成的工作。", "lessonEn": "Rest is a legitimate need; remaining work still needs a plan."}, {"id": "C", "zh": "先安排好明天的工作、設定鬧鐘，今晚早點睡", "en": "Plan tomorrow's tasks, set an alarm and get an early night", "cost": 0, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -12, "axes": [-1, 1, 1], "lessonZh": "把休息列入計劃，不必先花錢才算解決問題。", "lessonEn": "Plan for rest; solving a problem does not always require spending."}, {"id": "D", "zh": "跟同學去他提議的咖啡店坐一會，花 $40", "en": "Take up a classmate’s suggestion for a short café break together; spend $40", "cost": 40, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -5, "axes": [1, -1, -1], "lessonZh": "短暫社交休息有成本，應與可負擔金額配合。", "lessonEn": "A social break has a cost; match it to what you can afford."}, {"id": "E", "zh": "跟組員重新分工、確認期限，讓大家今晚早點休息", "en": "Talk through tasks and deadlines with your teammates so everyone can rest earlier", "cost": 0, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -10, "axes": [1, 1, 1], "lessonZh": "共同調整安排需要同意；互相支援不一定涉及消費。", "lessonEn": "A shared schedule needs agreement; support need not involve spending."}]}, {"zh": "你的舊電腦突然壞了！這次是主機板出問題，跟之前的電池無關。偏偏有份功課兩天後就要交，幸好檔案已備份到雲端。你會怎樣處理？", "en": "Your old laptop has suddenly stopped working! This time it's the motherboard, not the battery. You have an assignment due in two days, but luckily your files are backed up in the cloud. What would you do?", "principleZh": "應急資金與可行替代方案", "principleEn": "Emergency funds and workable alternatives", "options": [{"id": "A", "zh": "花 $1,500 即日修好，先用儲備，繼續用自己的電腦", "en": "Pay $1,500 to get it repaired today, using reserve first, so you can keep using your own laptop", "cost": 1500, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -5, "axes": [-1, 1, 1], "lessonZh": "這是用自己的資金承擔損失，不是把風險轉移給他人。", "lessonEn": "This uses your own funds to absorb a loss; it does not transfer risk.", "reserveFirst": true}, {"id": "B", "zh": "先用手機做一份基本版本交上去，修電腦遲些再想", "en": "Submit a basic version using your phone and think about repairs later", "cost": 0, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": 20, "axes": [-1, -1, -1], "lessonZh": "暫時省下現金，但手機限制會增加這次工作的負擔。", "lessonEn": "This preserves cash now, but phone limitations make the task harder."}, {"id": "C", "zh": "接受朋友借電腦的提議，跟他約好準時歸還", "en": "Borrow the laptop your friend offered and agree to return it on time", "cost": 0, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": -5, "axes": [1, 0, -1], "lessonZh": "朋友支援有價值；借用不必以請客作交換。", "lessonEn": "Support has value; a loan need not require buying a meal in return."}, {"id": "D", "zh": "比較過後，選 $900、有書面保養的維修，要等一天", "en": "After comparing options, choose the $900 repair with a written warranty; it takes a day", "cost": 900, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": 8, "axes": [-1, 1, 1], "lessonZh": "價格不是品質的唯一指標；比較保障、工期和資料安排。", "lessonEn": "Price alone does not determine quality; compare warranty, timing and data arrangements."}, {"id": "E", "zh": "趕去圖書館借電腦，開啟雲端檔案完成功課，維修先等等", "en": "Rush to the library to use a computer, open your cloud files and finish the assignment; leave repairs for later", "cost": 0, "income": 0, "transfer": 0, "borrow": 0, "fee": 0, "stress": 10, "axes": [0, 1, 1], "lessonZh": "圖書館電腦不需額外支出，但趕路、借用時限及陌生設備會增加時間壓力。", "lessonEn": "Library computers avoid extra spending, but travel, session limits and unfamiliar equipment add time pressure."}]}];

const $=id=>document.getElementById(id),T=(z,e)=>lang==='zh'?z:e;
const money=n=>(n<0?'-':'')+'HK$'+Math.abs(n).toLocaleString('en-HK');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PROFILES={"S_F_R":["全方位策略家","The Balanced Strategist"],"S_F_A":["謹慎社交者","The Cautious Socialite"],"S_P_R":["體驗探索家","The Experience Seeker"],"S_P_A":["隨性享樂派","The YOLO Spender"],"I_F_R":["效率精算師","The Ambitious Optimizer"],"I_F_A":["極限生存者","The Extreme Survivor"],"I_P_R":["捷徑投資客","The Productivity Hacker"],"I_P_A":["焦慮逃避者","The Anxious Avoider"]};
const initial=()=>({cash:4000,reserve:0,debt:0,stress:20,axes:[0,0,0],stage:0,reason:'completed'});
function profile(s=state){const mixed=s.axes.some(v=>Math.abs(v)<=1);return {mixed,provisional:history.length<8,key:(s.axes[0]>0?'S':'I')+'_'+(s.axes[1]>=0?'F':'P')+'_'+(s.axes[2]>=0?'R':'A')};}
// Pure money engine: transfers preserve assets; debt includes the stated fixed fee.
function calculate(s,o,useReserve=false){let cash=s.cash+o.income+o.borrow-o.cost-o.transfer,reserve=s.reserve+o.transfer,used=0;
 if(o.reserveFirst){used=Math.min(s.reserve,o.cost);cash+=used;reserve-=used;}
 if(cash<0&&useReserve){const more=Math.min(reserve,-cash);used+=more;cash+=more;reserve-=more;}
 return {cash,reserve,debt:s.debt+o.borrow+o.fee,stress:Math.max(0,Math.min(100,s.stress+o.stress)),axes:s.axes.map((v,i)=>v+o.axes[i]),stage:s.stage,reason:s.reason,used};}
function setText(id,z,e){$(id).textContent=T(z,e);}
function rules(){return T('你扮演已有舊電腦、可使用校園資源的大學生。90 天的基本食宿、日常交通及學費已另作安排；HK$4,000 只用於本遊戲的額外選擇與突發事件。所有價格、工資及壓力點數均為教學設定。','You play a student with an older laptop and access to campus resources. Basic meals, housing, daily travel and tuition for 90 days are covered separately. HK$4,000 covers the extra choices and emergencies in this game. Prices, wages and stress points are illustrative settings.');}
function method(){return T('我們記錄三種取向：個人或群體需要、當下或未來安排、主動調整或沿用／暫緩安排。每個選擇只在有關的軸加 1、減 1 或不加分；總分 −1 至 +1 表示傾向未明顯，不硬分成單一類型。完成少於 8 題只提供初步觀察。這些分界是待試玩的設計設定。這是本次情境的反思工具，不是人格診斷，也沒有好壞排名。','We track personal or group needs, present or future priorities, and initiating changes or using existing/deferring plans. Relevant axes receive +1, −1 or 0 per choice. Totals from −1 to +1 are mixed rather than forced into one type. Fewer than 8 decisions gives preliminary observations only. These cutoffs are design settings awaiting user testing. This reflects this playthrough, not a personality diagnosis or a ranking.');}

 $('start-title').innerHTML=T('大學生存指南<br><span>理財情境與行為反思</span>','Uni Survival Guide<br><span>Choices & financial reflection</span>');
 setText('wallet-title','你的學期錢包','YOUR SEMESTER WALLET');setText('wallet-days','90 天','90 DAYS');setText('wallet-scenes','10 個情境','10 SCENARIOS');setText('wallet-choice','由你選擇','YOUR CHOICE');
 setText('start-intro-title','遊戲設定與規則','Setting & rules');$('start-intro-1').textContent=rules();

 setText('method-title','遊戲如何判斷你的取向？','How are your tendencies identified?');$('method-copy').textContent=method();

function toggleLanguage(){lang=lang==='zh'?'en':'zh';updateStatic();if(!$('report-screen').classList.contains('hidden'))renderReport();}
function show(id){$(id).classList.remove('hidden');}function hide(id){$(id).classList.add('hidden');}
function modalOpen(){return !$('feedback-modal').classList.contains('hidden');}
function openModal(title,body,buttons){$('feedback-title').textContent=title;$('feedback-body').innerHTML=body;$('modal-actions').innerHTML='';for(const b of buttons){const el=document.createElement('button');el.textContent=b.label;el.onclick=b.action;el.className='action '+(b.secondary?'secondary':'');$('modal-actions').appendChild(el);}show('feedback-modal');$('game-ui').inert=true;$('modal-actions').querySelector('button').focus();}

function startGame(){state=initial();history=[];settled=false;pending=null;preConfidence=Number($('pre-conf-slider').value);postConfidence=5;hide('start-screen');hide('report-screen');hide('lang-switcher-container');show('game-ui');updateUI();renderQuestion();}
function updateUI(){$('budget-display').textContent=money(state.cash);$('emergency-display').textContent=money(state.reserve);$('stress-display').textContent=state.stress+' / 100';$('budget-bar').style.width=Math.min(100,Math.max(0,state.cash/4000*100))+'%';$('emergency-bar').style.width=Math.min(100,state.reserve/1500*100)+'%';$('stress-bar').style.width=state.stress+'%';$('stress-bar').style.background=state.stress>=80?'#b5443e':'#83a773';$('debt-status').textContent=T('期末應還：','Due at term end: ')+money(state.debt);$('net-status').textContent=T('淨資金：','Net funds: ')+money(state.cash+state.reserve-state.debt);$('budget-warning').textContent=state.cash<500?T('留意現金餘額','Cash is running low'):'';}
function effect(o){let a=[];if(o.cost)a.push(T('支出 ','Cost ')+money(o.cost));if(o.income)a.push(T('收入 ','Income ')+money(o.income));if(o.transfer)a.push(T('轉存 ','To reserve ')+money(o.transfer));if(o.borrow)a.push(T('借入 ','Borrow ')+money(o.borrow)+T('／期末還 ',' / repay ')+money(o.borrow+o.fee));if(!a.length)a.push(T('無金錢變動','No money movement'));a.push(T('壓力 ','Stress ')+(o.stress>0?'+':'')+o.stress);return a.join(' · ');}
function renderQuestion(){const q=GAME[state.stage];$('stage-indicator').textContent=state.stage===9?T('期末突發事件','TERM-END EVENT'):T('第 ','MONTH ')+(Math.floor(state.stage/3)+1)+T(' 個月','');$('decision-counter').textContent=(state.stage+1)+' / 10';$('question-text').textContent=q[lang];$('context-note').textContent=state.stage===7?T('你目前可用現金為 ','Your current cash is ')+money(state.cash)+T('。請按自己的需要決定。','. Decide based on your needs.'):'';
 $('timeline').innerHTML=GAME.map((_,i)=>`<span class="${i<state.stage?'done':i===state.stage?'now':''}"></span>`).join('');
 $('options-container').innerHTML='';q.options.forEach((o,i)=>{const btn=document.createElement('button');btn.innerHTML=`<div>${T('選項','Option')} ${o.id}</div><div>${esc(o[lang])}<small class="effects">${esc(effect(o))}</small></div>`;btn.onclick=()=>selectOption(i);$('options-container').appendChild(btn);});window.scrollTo(0,0);}
function selectOption(i){if(modalOpen()||state.stage>=GAME.length)return;const o=GAME[state.stage].options[i],n=calculate(state,o);pending=i;
 if(n.cash<0){const possible=n.cash+n.reserve>=0;openModal(T('先檢查可用資金','Check available funds'),`<p>${possible?T('這個選擇需要額外動用儲備 ','This choice needs a reserve withdrawal of ')+money(-n.cash):T('現金與儲備合計不足，請選另一個安排。','Cash and reserve together are insufficient. Choose another arrangement.')}</p>`,[...(possible?[{label:T('確認動用儲備','Use reserve'),action:()=>commitChoice(i,true)}]:[]),{label:T('返回選項','Choose again'),secondary:true,action:()=>{closeModal();pending=null;$('options-container').querySelector('button').focus();}}]);return;}
 commitChoice(i,false);}
function commitChoice(i,useReserve){const q=GAME[state.stage],o=q.options[i],before=structuredClone(state),n=calculate(state,o,useReserve);if(n.cash<0||n.reserve<0)throw Error('Invalid funding');state=n;history.push({stage:state.stage,option:o.id,before,after:structuredClone(state),used:n.used});pending=null;updateUI();const changes=[['現金','Cash',n.cash-before.cash],['儲備','Reserve',n.reserve-before.reserve],['應還款','Amount owed',n.debt-before.debt],['壓力','Stress',n.stress-before.stress]];
 openModal(T('你的選擇 / ','Your choice / ')+o.id,`<p class="quote">${esc(o[lang])}</p><div class="lesson"><small>${esc(T(q.principleZh,q.principleEn))}</small><p>${esc(T(o.lessonZh,o.lessonEn))}</p></div><div class="changes">${changes.map((x,j)=>`<div>${T(x[0],x[1])}<b>${j===3?(x[2]>0?'+':'')+x[2]:(x[2]>0?'+':'')+money(x[2])}</b></div>`).join('')}</div>${n.used?'<p>'+T('本次動用儲備：','Reserve used: ')+money(n.used)+'</p>':''}<p class="muted">${T('實際壓力：','Actual stress: ')}${before.stress} → ${n.stress}${n.stress===100?T('。已達暫停門檻。','. Pause threshold reached.'):''}</p>`,[{label:n.stress===100?T('暫停並查看報告','Pause and view report'):state.stage===9?T('期末結算及報告','Settle and view report'):T('繼續下一階段','Continue'),action:nextStage}]);}
function nextStage(){closeModal();if(state.stress>=100){state.reason='stress';finish();return;}state.stage++;if(state.stage===GAME.length)finish();else if(state.stage===9){openModal(T('🚨 突發情況！','🚨 Emergency!'),'<p class="emergency-emoji" aria-hidden="true">🚨</p><p>'+T('糟了，你的電腦突然壞了！還有功課要交，先看看可以怎樣處理。',"Your laptop has suddenly stopped working! You have an assignment due—let’s see what you can do.")+'</p>',[{label:T('面對突發情況','Continue to the emergency'),action:()=>{closeModal();renderQuestion();$('options-container').querySelector('button').focus();}}]);}else{renderQuestion();$('options-container').querySelector('button').focus();}}
let settlement={paid:0,remaining:0};
function finish(){if(!settled){const due=state.debt,payCash=Math.min(state.cash,due),payReserve=Math.min(state.reserve,due-payCash);state.cash-=payCash;state.reserve-=payReserve;state.debt-=payCash+payReserve;settlement={due,paid:payCash+payReserve,fromReserve:payReserve,remaining:state.debt};settled=true;if(state.debt>0&&state.reason==='completed')state.reason='shortfall';}hide('game-ui');show('report-screen');show('lang-switcher-container');renderReport();window.scrollTo(0,0);}
function axisDescription(i,value){const names=[['個人需要','群體需要','Personal needs','Group needs'],['當下安排','未來安排','Present priorities','Future priorities'],['沿用／暫緩','主動調整','Existing/deferred plans','Initiating changes']][i];const label=Math.abs(value)<=1?T('取向未明顯','Mixed tendency'):T(names[value>0?1:0],names[value>0?3:2]);return label;}
function profileTitle(){const p=profile();return p.provisional?T('初步觀察：暫不作類型判定','Preliminary observations: no type assigned'):p.mixed?T('混合取向：暫不歸入單一類型','Mixed tendencies: no single type'):PROFILES[p.key][lang==='zh'?0:1];}
function reflectionTips(){let tips=[];if(settlement.remaining>0)tips.push(T('你仍有應還款。先列出金額與還款時間，再安排非必要支出。','You still owe money. List the amount and repayment timing before optional spending.'));else if(settlement.due>0)tips.push(T('你已結清模擬借款。比較借款成本與當時其他可行選擇。','Your simulated borrowing is repaid. Compare its cost with alternatives available then.'));
 if(state.reserve<500)tips.push(T('結算後儲備少於本遊戲參考線 $500。想一個適合自己情況的第一筆儲備目標；$500 並不是通用標準。','Reserve is below this game’s illustrative $500 reference. Choose a first reserve goal suited to you; $500 is not a universal rule.'));
 if(state.stress>=60)tips.push(T('本次遊戲壓力較高。回看哪些安排增加負荷，為休息與求助預留時間。','Game stress is relatively high. Review which arrangements added load and plan time for rest and support.'));
 if(!tips.length)tips.push(T('你在本次結算後仍有資金緩衝。選一個較花時間的決定，想想現實中是否可持續。','You retain a financial buffer after settlement. Pick one time-consuming decision and consider whether it is sustainable.'));
 tips.push(T('這些觀察只依據本次選擇，不能推斷你真實的朋友數量、健康或日常消費。','These observations concern this playthrough only, not your real friendships, health or everyday spending.'));return tips;}
function section(title,body){return `<section class="report-section"><h3>${title}</h3>${body}</section>`;}
function completionNote(){return history.length<10?T('本次完成 '+history.length+' / 10 個情境。本次未進入緊急情境（第十題）；可重新遊玩以體驗突發應變。','You completed '+history.length+' / 10 scenarios. You did not reach the emergency scenario (10); play again to explore emergency planning.'):T('本次已進入緊急情境（第十題）。','You reached the emergency scenario (10).');}
function renderReport(){const p=profile(),totalIncome=history.reduce((a,h)=>a+GAME[h.stage].options.find(o=>o.id===h.option).income,0),totalCost=history.reduce((a,h)=>a+GAME[h.stage].options.find(o=>o.id===h.option).cost,0);
 const cards=[['結算後現金','Cash after settlement',money(state.cash)],['結算後儲備','Reserve after settlement',money(state.reserve)],['仍欠款項','Still owed',money(state.debt)],['淨資金','Net funds',money(state.cash+state.reserve-state.debt)],['遊戲壓力','Game stress',state.stress+'/100'],['已完成情境','Decisions made',history.length+'/10']];
 let html=`<div class="report-head"><p class="eyebrow">WISESPEND / ${T('本次遊戲紀錄','YOUR PLAYTHROUGH')}</p><h2>${T('你的選擇與下一步','Your choices and next steps')}</h2><p>${T('情境學習與反思，不是人格診斷','A learning reflection, not a personality diagnosis')}</p></div>`;
 html+=section(T('01 / 本次結果','01 / Your outcome'),`<p>${state.reason==='stress'?T('本次挑戰因累積情境負荷令遊戲壓力達 100 而提前結束。這是遊戲設定，不代表真實心理狀況。','This attempt ended because accumulated scenario load reached stress 100. These are game settings, not a real mental-health assessment.'):state.reason==='shortfall'?T('你完成了情境，但結算後仍有未清還款項。','You completed the scenarios but still owe money after settlement.'):T('你完成了十個情境及結算。','You completed all ten scenarios and settlement.')}</p><p class="lesson">${completionNote()}</p><div class="report-stats">${cards.map(c=>`<div>${T(c[0],c[1])}<b>${c[2]}</b></div>`).join('')}</div><p class="muted">${T('遊戲內收入','Game earnings')} ${money(totalIncome)} · ${T('支出','Spending')} ${money(totalCost)} · ${T('結算應還／已還／未還','Settlement due / paid / unpaid')} ${money(settlement.due)} / ${money(settlement.paid)} / ${money(settlement.remaining)}</p>`);
 html+=section(T('02 / 你的行為取向','02 / Your tendencies'),`<div class="lesson"><h2>${esc(profileTitle())}</h2><p>${p.provisional?T('少於 8 題：以下只屬初步觀察，不作確定分類。','Fewer than 8 decisions: observations are preliminary, not a firm classification.'):T('此名稱是本次選擇的記憶標籤，沒有高低優劣之分。','This name is a memorable label for these choices, not a ranking.')}</p></div><div class="axes">${state.axes.map((v,i)=>`<div><b>${axisDescription(i,v)}</b><span>${v>0?'+':''}${v} / ${T('已評分','scored')} ${history.filter(h=>GAME[h.stage].options.find(o=>o.id===h.option).axes[i]!==0).length} ${T('次','choices')}</span><div class="axis-track"><i style="left:${50+v/20*100}%"></i></div></div>`).join('')}</div><p class="muted">${method()}</p>`);
 html+=section(T('03 / 選擇證據與可留意之處','03 / Evidence and reflection'),`<p>${T('以下逐項保留你真正選過的安排，沒有推斷未選過的行為。','These are the choices you actually made, with no assumptions about choices you did not make.')}</p><details><summary>${T('查看本次選擇紀錄','Your decision record')}</summary>${history.map(h=>{const q=GAME[h.stage],o=q.options.find(o=>o.id===h.option);return `<div class="decision-row"><b>${h.stage+1}. ${esc(o[lang])}</b><p>${esc(T(o.lessonZh,o.lessonEn))}</p><small>${T('現金','Cash')} ${money(h.before.cash)} → ${money(h.after.cash)} · ${T('儲備','Reserve')} ${money(h.before.reserve)} → ${money(h.after.reserve)} · ${T('應還','Owed')} ${money(h.after.debt)} · ${T('壓力','Stress')} ${h.before.stress} → ${h.after.stress}</small></div>`}).join('')}</details><ul>${reflectionTips().map(t=>`<li>${t}</li>`).join('')}</ul>`);
 html+=section(T('04 / 實用技巧與七天小行動','04 / Practical tips and a seven-day action'),`<div class="tip-grid"><div><b>${T('先分清三種錢','Separate three kinds of money')}</b><p>${T('把可用現金、儲備及應還款分開列出。轉存不算收入，借款不算賺錢。','List available cash, reserve and repayments separately. A transfer is not income; borrowing is not earnings.')}</p></div><div><b>${T('比較總成本','Compare the whole cost')}</b><p>${T('比較金錢、時間和實際用途；不是最便宜就一定最好。','Compare money, time and usefulness; the cheapest option is not always the best.')}</p></div><div><b>${T('先問清楚再續訂','Check before renewing')}</b><p>${T('查看下一次扣款日、使用頻率、取消條件及免費替代品。','Check the next charge, usage, cancellation terms and free alternatives.')}</p></div><div><b>${T('留一個可行後備方案','Keep a workable backup')}</b><p>${T('確認備份、校園借用資源及可求助的人，不假設隨時都可用。','Check backups, campus loans and people you can ask; do not assume instant availability.')}</p></div></div><label for="action-plan">${T('未來七天，我會做的一件事：','One thing I will do in the next seven days:')}</label><textarea id="action-plan" maxlength="500" placeholder="${T('例如：星期三檢查一個訂閱，記下續期日及費用。','Example: check one subscription on Wednesday and note its renewal date and fee.')}"></textarea><p class="muted">${T('行動及信心記錄只保存在這次開啟的頁面；不會自動傳送；如需保留，請自行複製記錄。','Action and confidence entries stay in this open page; copy them yourself if you want to keep them. Nothing is submitted automatically.')}</p>`);
 html+=section(T('05 / 其他取向：理解差異，不是排名','05 / Other tendencies, not a ranking'),`<details><summary>${T('查看八種取向組合','View all eight combinations')}</summary><p>${T('保留部分原有名稱作記憶用途；原「極限生存者／捷徑投資客／焦慮逃避者」改用較中性的名稱。','Some familiar labels remain; the former Extreme Survivor, Productivity Hacker and Anxious Avoider labels now use more neutral names.')}</p><div class="profile-grid">${Object.entries(PROFILES).map(([k,n])=>`<div><b>${esc(n[lang==='zh'?0:1])}</b><p>${axisDescription(0,k[0]==='S'?2:-2)} · ${axisDescription(1,k[2]==='F'?2:-2)} · ${axisDescription(2,k[4]==='R'?2:-2)}</p></div>`).join('')}</div><p>${T('不同取向都有可用之處；是否合適要看預算、情境及代價。','Different tendencies can be useful; suitability depends on context, budget and trade-offs.')}</p></details>`);
 html+=section(T('06 / 課後反思','06 / Reflection'),`<label for="post-conf-slider">${T('現在，你有多大信心處理電腦故障的開支？1＝沒有信心，10＝很有信心。','Now, how confident are you about handling a laptop repair cost? 1 = not confident, 10 = very confident.')}</label><input id="post-conf-slider" type="range" min="1" max="10" value="${postConfidence}" oninput="postConfidence=Number(this.value);document.getElementById('post-conf-val').textContent=this.value"><b id="post-conf-val">${postConfidence}</b><p>${T('開始前：','Before: ')}${preConfidence} / 10 · ${T('信心變化不等於能力或真實行為改變。','A confidence change is not proof of skill or real-world behavior change.')}</p>`);
 const plan=$('action-plan')?.value||'';$('report-content').innerHTML=html;$('action-plan').value=plan;
 $('report-actions').innerHTML=`<a class="action" href="https://forms.gle/EbWCG5pwHYGRi9qR7" target="_blank" rel="noopener noreferrer">${T('第 3 步：填寫課後問卷 ↗','Step 3: Post-game survey ↗')}</a><p id="booklet-status" role="status" aria-live="polite"></p><button class="action secondary" onclick="downloadBooklet()">${T('下載個人理財手冊（PDF）','Download your booklet (PDF)')}</button><button class="action secondary" onclick="resetGame()">${T('重新遊玩','Play again')}</button>`;}
async function downloadBooklet(referenceKey=null){const p=profile(),key=referenceKey||((p.mixed||p.provisional)?'general':p.key),status=$('booklet-status');if(bookletBusy)return;bookletBusy=true;try{if(status)status.textContent=T('正在準備手冊…','Preparing your booklet…');const response=await fetch('booklets/'+lang+'_'+key+'.pdf');if(!response.ok)throw Error('Booklet unavailable');saveBlob(await response.blob(),'WiseSpend_'+(referenceKey?PROFILES[key][lang==='zh'?0:1]:profileTitle())+'.pdf');if(status)status.textContent=T('手冊已準備好，請查看裝置的下載項目。','Your booklet is ready. Check your downloads.');}catch(error){console.error(error);if(status)status.textContent=T('暫時未能下載，請稍後再試。','Download failed. Please try again.');}finally{bookletBusy=false;}}
let bookletBusy=false;
function printReport(){document.querySelectorAll('#report-content details').forEach(d=>d.open=true);$('print-plan').textContent=$('action-plan').value||T('尚未填寫','Not entered');$('print-confidence').textContent=T('課前／課後信心：','Before / after confidence: ')+preConfidence+' / '+postConfidence;window.print();}
function saveBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),60000);}
function resetGame(){hide('report-screen');show('start-screen');show('lang-switcher-container');$('pre-conf-slider').value=5;$('pre-conf-val').textContent='5';state=initial();history=[];postConfidence=5;window.scrollTo(0,0);}
document.addEventListener('keydown',e=>{if(modalOpen()&&e.key==='Tab'){const a=[...$('modal-actions').querySelectorAll('button')],i=a.indexOf(document.activeElement);e.preventDefault();a[(i+(e.shiftKey?-1:1)+a.length)%a.length].focus();}});
updateStatic();state=initial();

</script></body></html>
