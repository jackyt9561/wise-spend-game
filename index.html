<!DOCTYPE html>
<html lang="zh-HK">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大學生存指南：90日財務保衛戰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        .fade-in { animation: fadeIn 0.35s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .progress-bar { transition: width 0.4s ease-in-out, background-color 0.4s ease-in-out; }
        .app-container { max-width: 480px; margin: 0 auto; min-height: 100vh; background-color: #ffffff; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); position: relative; display: flex; flex-direction: column; }

        .exporting .hide-on-export { display: none !important; }

<body class="text-gray-800 antialiased">

<div class="app-container">
    <div id="lang-container" class="absolute top-4 right-4 z-50">
        <button onclick="toggleLanguage()" class="bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-1.5 px-3.5 rounded-full shadow-sm text-xs border border-gray-300 transition-colors">
            <span id="lang-toggle-text">EN</span>
        </button>
    </div>

    <div id="start-screen" class="flex-1 flex flex-col justify-center items-center p-6 text-center fade-in overflow-y-auto">
        <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mb-4 shadow-inner">
            <span class="text-3xl">🎓</span>
        </div>
        <h1 id="game-title" class="text-2xl font-extrabold text-gray-900 mb-2 tracking-tight"></h1>
        <p id="game-subtitle" class="text-xs text-blue-600 font-bold mb-4 uppercase tracking-wider"></p>

        <div class="bg-gray-50 border border-gray-200 rounded-2xl p-4 mb-4 text-left w-full shadow-sm">
            <p id="tutorial-title" class="text-sm font-bold text-gray-800 mb-2"></p>
            <ul id="tutorial-rules" class="text-xs text-gray-600 space-y-2 leading-relaxed"></ul>
        </div>

        <div class="bg-white border border-gray-200 rounded-2xl p-4 mb-5 text-left w-full shadow-sm">
            <p id="allocation-title" class="text-sm font-bold text-gray-900 mb-2"></p>
            <p id="allocation-desc" class="text-[11px] text-gray-500 mb-3"></p>
            <div class="space-y-2.5">
                <label class="block">
                    <span id="essentials-label" class="text-[11px] font-semibold text-gray-600"></span>
                    <input id="essentials-input" type="number" min="0" step="100" class="mt-1 w-full p-2.5 border border-gray-300 rounded-lg text-sm" />
                </label>
                <label class="block">
                    <span id="flex-label" class="text-[11px] font-semibold text-gray-600"></span>
                    <input id="flex-input" type="number" min="0" step="100" class="mt-1 w-full p-2.5 border border-gray-300 rounded-lg text-sm" />
                </label>
                <label class="block">
                    <span id="emergency-label" class="text-[11px] font-semibold text-gray-600"></span>
                    <input id="emergency-input" type="number" min="0" step="100" class="mt-1 w-full p-2.5 border border-gray-300 rounded-lg text-sm" />
                </label>
            </div>
            <p id="allocation-summary" class="text-[11px] text-gray-500 mt-2"></p>
            <p id="allocation-warning" class="hidden text-[11px] text-red-600 mt-1 font-medium"></p>
        </div>

        <button id="start-btn" onclick="startGame()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-8 rounded-xl shadow-lg transition-transform transform active:scale-95 text-sm"></button>
    </div>

    <div id="game-screen" class="hidden flex-1 flex-col h-full fade-in">
        <div class="bg-white px-6 py-4 border-b border-gray-100 sticky top-0 z-10 shadow-sm">
            <div class="flex justify-between items-end mb-2">
                <div>
                    <p id="budget-label" class="text-[10px] text-gray-400 font-semibold uppercase tracking-wider mb-0.5"></p>
                    <p class="text-xl font-bold text-gray-900" id="money-display">HK$0</p>
                </div>
                <div class="text-right">
                    <p id="progress-label" class="text-[10px] text-gray-400 font-semibold uppercase tracking-wider mb-0.5"></p>
                    <p class="text-xs font-bold text-blue-600" id="stage-display"></p>
                </div>
            </div>
            <div class="mb-2.5">
                <div class="w-full bg-gray-100 rounded-full h-1.5 overflow-hidden">
                    <div id="budget-bar" class="progress-bar bg-blue-500 h-1.5 rounded-full" style="width: 100%"></div>
                </div>
            </div>
            <div>
                <div class="flex justify-between items-end mb-1">
                    <span id="stress-label" class="text-[10px] font-semibold text-gray-500"></span>
                    <span class="text-[10px] font-bold text-gray-700" id="stress-text">0/100</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2 overflow-hidden">
                    <div id="stress-bar" class="progress-bar bg-green-500 h-2 rounded-full" style="width: 0%"></div>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-2 mt-2.5">
                <div class="bg-gray-50 border border-gray-100 rounded-lg p-2">
                    <p id="emergency-kpi-label" class="text-[10px] text-gray-400 font-semibold"></p>
                    <p id="emergency-kpi" class="text-xs font-bold text-gray-800"></p>
                </div>
                <div class="bg-gray-50 border border-gray-100 rounded-lg p-2">
                    <p id="debt-kpi-label" class="text-[10px] text-gray-400 font-semibold"></p>
                    <p id="debt-kpi" class="text-xs font-bold text-gray-800"></p>
                </div>
                <div class="bg-gray-50 border border-gray-100 rounded-lg p-2">
                    <p id="wellbeing-kpi-label" class="text-[10px] text-gray-400 font-semibold"></p>
                    <p id="wellbeing-kpi" class="text-xs font-bold text-gray-800"></p>
                </div>
                <div class="bg-gray-50 border border-gray-100 rounded-lg p-2">
                    <p id="academic-kpi-label" class="text-[10px] text-gray-400 font-semibold"></p>
                    <p id="academic-kpi" class="text-xs font-bold text-gray-800"></p>
                </div>
            </div>
            <p id="risk-warning" class="hidden text-[10px] text-orange-700 bg-orange-50 border border-orange-200 rounded-lg px-2 py-1 mt-2"></p>
        </div>

        <div class="flex-1 overflow-y-auto p-6 bg-gray-50 pb-20">
            <div id="question-card" class="fade-in">
                <div class="flex items-center justify-between mb-2">

                </div>
                <h2 id="scenario-title" class="text-base font-bold text-gray-800 mb-1.5"></h2>
                <p id="scenario-desc" class="text-sm text-gray-600 mb-5 leading-relaxed"></p>
                <p id="recurring-note" class="hidden text-[11px] text-blue-700 bg-blue-50 border border-blue-100 rounded-lg p-2 mb-3"></p>
                <div id="options-container" class="space-y-3"></div>
            </div>

            <div id="feedback-card" class="hidden fade-in bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                <div class="mb-4 p-3.5 bg-gray-50 rounded-xl border-l-4 border-blue-500">
                    <p id="feedback-quote-label" class="text-[10px] text-gray-400 font-semibold uppercase tracking-wider mb-1.5"></p>
                    <p id="feedback-quote" class="italic text-xs text-gray-700 font-medium"></p>
                </div>
                <div class="mb-4">
                    <p id="feedback-lesson-label" class="text-[10px] text-gray-400 font-semibold uppercase tracking-wider mb-1.5"></p>
                    <p id="feedback-lesson" class="text-xs text-gray-800 leading-relaxed"></p>
                </div>

        </div>

    </div>

            </div>

            <div class="grid grid-cols-2 gap-2 mb-5">

                    <p id="score-wellbeing" class="text-xs font-bold text-blue-900"></p>
                </div>
                <div class="bg-blue-50 border border-blue-100 rounded-lg p-2.5 text-center">

                    <p id="score-debt" class="text-xs font-bold text-blue-900"></p>
                </div>
                <div class="bg-blue-50 border border-blue-100 rounded-lg p-2.5 text-center">
                    <p id="score-resilience-label" class="text-[10px] text-blue-700 font-semibold"></p>
                    <p id="score-resilience" class="text-xs font-bold text-blue-900"></p>
                </div>
            </div>

            <div class="bg-gray-50 border border-gray-200 rounded-xl p-4 mb-4">

            </div>

            <div class="mb-4">

            </div>

            <div class="mb-4">

            <p class="text-[10px] text-center text-gray-300 mt-6 pt-4 border-t border-gray-100">大學生存指南：90日財務保衛戰 · HKD</p>
        </div>

        <div class="p-6 pt-0 bg-white hide-on-export flex-col space-y-3">

        </div>
    </div>
</div>

    function formatHKD(value) {
        const abs = Math.abs(Math.round(value)).toLocaleString('en-HK');
        return value < 0 ? `-HK$${abs}` : `HK$${abs}`;
    }

    function text(key) {
        return translations[currentLang][key];
    }

    function clampState() {
        state.stress = Math.max(0, Math.min(100, state.stress));
        state.wellbeing = Math.max(0, Math.min(100, state.wellbeing));
        state.academic = Math.max(0, Math.min(100, state.academic));
        state.resilience = Math.max(0, Math.min(100, state.resilience));
    }

    function refreshAllocationSummary() {
        const e = Number(document.getElementById('essentials-input').value || 0);
        const f = Number(document.getElementById('flex-input').value || 0);
        const m = Number(document.getElementById('emergency-input').value || 0);
        const total = e + f + m;
        const remain = START_BUDGET - total;

        document.getElementById('allocation-summary').textContent = text('allocationSummary')(formatHKD(total), formatHKD(remain));
        const warning = document.getElementById('allocation-warning');
        warning.classList.add('hidden');
        warning.textContent = '';

        if (total > START_BUDGET) {
            warning.textContent = text('warnOver');
            warning.classList.remove('hidden');
        } else if (total === START_BUDGET && e < MONTHLY_ESSENTIAL * 2.5) {
            warning.textContent = text('warnLowEssentials');
            warning.classList.remove('hidden');
        }
    }

            updateStats();

                generateReport();
            } else if (!document.getElementById('question-card').classList.contains('hidden')) {
                loadQuestion(true);
            } else {
                renderFeedback();
            }
        }

    function applyMonthlyRecurring(month) {
        if (state.monthApplied.has(month)) return '';
        state.monthApplied.add(month);

        let messages = [];
        messages.push(text('monthDeducted')(month, formatHKD(MONTHLY_ESSENTIAL)));

        if (state.debt > 0) {
            const interest = Math.round(state.debt * DEBT_INTEREST_RATE);
            state.debt += interest;
            messages.push(text('debtInterest')(formatHKD(interest)));

            const minPayment = Math.min(state.debt, Math.max(50, Math.round(state.debt * 0.2)));
            const paid = Math.min(state.money, minPayment);
            state.money -= paid;
            state.debt -= paid;
            messages.push(text('debtRepay')(formatHKD(paid)));
            if (paid < minPayment) {
                state.stress += 5;
                state.wellbeing -= 3;
                messages.push(text('debtShort'));
            }
        }

        let left = MONTHLY_ESSENTIAL;
        const useEssentials = Math.min(state.essentialsPool, left);
        state.essentialsPool -= useEssentials;
        left -= useEssentials;

        if (left > 0) {
            const useCash = Math.min(state.money, left);
            state.money -= useCash;
            left -= useCash;
        }

        if (left > 0) {
            state.debt += left;
            state.stress += 6;
            state.wellbeing -= 4;
        }

        clampState();
        return messages.join(' ');
    }

    function updateStats() {
        const q = gameData[state.stage];
        document.getElementById('money-display').textContent = formatHKD(state.money);
        document.getElementById('stage-display').textContent = q ? q.stageId[currentLang] : '';

        const budgetPercent = Math.max(0, Math.min(100, ((state.money + state.emergency) / START_BUDGET) * 100));
        const budgetBar = document.getElementById('budget-bar');
        budgetBar.style.width = budgetPercent + '%';
        if (budgetPercent >= 60) budgetBar.className = 'progress-bar bg-blue-500 h-1.5 rounded-full';
        else if (budgetPercent >= 30) budgetBar.className = 'progress-bar bg-yellow-400 h-1.5 rounded-full';
        else budgetBar.className = 'progress-bar bg-red-500 h-1.5 rounded-full';

        clampState();
        document.getElementById('stress-text').textContent = `${state.stress}/100`;
        const stressBar = document.getElementById('stress-bar');
        stressBar.style.width = state.stress + '%';
        if (state.stress < 40) stressBar.className = 'progress-bar bg-green-500 h-2 rounded-full';
        else if (state.stress < 75) stressBar.className = 'progress-bar bg-yellow-500 h-2 rounded-full';
        else stressBar.className = 'progress-bar bg-red-600 h-2 rounded-full';

        document.getElementById('emergency-kpi').textContent = formatHKD(state.emergency);
        document.getElementById('debt-kpi').textContent = formatHKD(state.debt);
        document.getElementById('wellbeing-kpi').textContent = `${state.wellbeing}/100`;
        document.getElementById('academic-kpi').textContent = `${state.academic}/100`;

        const risks = [];
        if (state.debt >= 1200) risks.push(text('riskDebt'));
        if (state.wellbeing <= 40) risks.push(text('riskWellbeing'));
        if (state.money <= 400 && state.emergency <= 300) risks.push(text('riskCash'));
        const riskBox = document.getElementById('risk-warning');
        if (risks.length) {
            riskBox.textContent = risks.join(' ');
            riskBox.classList.remove('hidden');
        } else {
            riskBox.classList.add('hidden');
        }
    }

    function startGame() {
        const essentials = Number(document.getElementById('essentials-input').value || 0);
        const flex = Number(document.getElementById('flex-input').value || 0);
        const emergency = Number(document.getElementById('emergency-input').value || 0);
        const total = essentials + flex + emergency;
        const warn = document.getElementById('allocation-warning');

        warn.classList.add('hidden');
        if (total > START_BUDGET) {
            warn.textContent = text('warnOver');
            warn.classList.remove('hidden');
            return;
        }
        if (total !== START_BUDGET) {
            warn.textContent = text('warnMismatch');
            warn.classList.remove('hidden');
            return;
        }

        state.stage = 0;
        state.essentialsPool = essentials;
        state.money = flex;
        state.emergency = emergency;
        state.debt = 0;
        state.stress = 25;
        state.wellbeing = 70;
        state.academic = 70;
        state.resilience = 50;
        state.history = [];
        state.lessons = new Set();
        state.started = true;
        state.answered = false;
        state.lastOptionIndex = -1;
        state.monthApplied = new Set();

        document.getElementById('lang-container').classList.add('hidden');
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('report-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('game-screen').classList.add('flex');

        const recurringMsg = applyMonthlyRecurring(1);
        loadQuestion();
        if (recurringMsg) {
            document.getElementById('feedback-extra').textContent = recurringMsg;
            document.getElementById('feedback-extra').classList.remove('hidden');
        }
    }

    function loadQuestion(isRerender = false) {
        if (!isRerender) updateStats();

        document.getElementById('feedback-card').classList.add('hidden');
        document.getElementById('question-card').classList.remove('hidden');
        document.getElementById('feedback-extra').classList.add('hidden');
        document.getElementById('recurring-note').classList.add('hidden');

        const currentQ = gameData[state.stage];
        document.getElementById('question-progress').textContent = text('questionProgress')(state.stage + 1, gameData.length);
        document.getElementById('scenario-title').textContent = currentQ.title[currentLang];
        document.getElementById('scenario-desc').textContent = currentQ.description[currentLang];

        const options = document.getElementById('options-container');
        options.innerHTML = '';

        currentQ.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'w-full text-left p-4 bg-white hover:bg-blue-50 border border-gray-200 hover:border-blue-300 rounded-xl text-xs font-medium text-gray-700 transition-all shadow-sm active:scale-[0.98]';
            btn.type = 'button';
            const label = document.createElement('div');
            label.className = 'flex items-center justify-between gap-2';
            const txt = document.createElement('span');
            txt.textContent = opt.text[currentLang];
            const arrow = document.createElement('span');
            arrow.className = 'text-gray-400 text-sm';
            arrow.textContent = '→';
            label.appendChild(txt);
            label.appendChild(arrow);
            btn.appendChild(label);
            btn.onclick = () => selectOption(idx);
            options.appendChild(btn);
        });

        const finalStage = state.stage === gameData.length - 1;
        document.getElementById('next-stage-btn').textContent = finalStage ? text('finalNextBtn') : text('nextBtn');
    }

    function applyEmergencyCost(option) {
        let left = option.emergencyCost;
        const useEmergency = Math.min(state.emergency, left);
        state.emergency -= useEmergency;
        left -= useEmergency;

        const useCash = Math.min(state.money, left);
        state.money -= useCash;
        left -= useCash;

        let debtAdded = 0;
        if (left > 0 && option.allowBorrow) {
            state.debt += left;
            debtAdded = left;
            left = 0;
        }

        if (left > 0) {
            state.stress += 6;
            state.academic -= 6;
            state.resilience -= 5;
        }

        return text('emergencyFlow')(formatHKD(useEmergency), formatHKD(useCash), formatHKD(debtAdded));
    }

    function selectOption(optionIndex) {
        if (state.answered) return;
        const currentQ = gameData[state.stage];
        const opt = currentQ.options[optionIndex];

        let feedbackExtra = '';

        if (currentQ.emergency) {
            feedbackExtra = applyEmergencyCost(opt);
        } else {
            state.money += opt.moneyChange || 0;
            state.debt += opt.debtChange || 0;
        }

        state.stress += opt.stressChange || 0;
        state.wellbeing += opt.wellbeingChange || 0;
        state.academic += opt.academicChange || 0;
        state.resilience += opt.resilienceChange || 0;
        clampState();

        state.history.push({ stage: state.stage, option: optionIndex, extra: feedbackExtra });
        state.lastOptionIndex = optionIndex;
        state.answered = true;

        updateStats();
        renderFeedback();
    }

    function renderFeedback() {
        document.getElementById('question-card').classList.add('hidden');
        document.getElementById('feedback-card').classList.remove('hidden');

        const currentQ = gameData[state.stage];
        const opt = currentQ.options[state.lastOptionIndex];

        document.getElementById('feedback-quote').textContent = `"${opt.quote[currentLang]}"`;
        document.getElementById('feedback-lesson').textContent = opt.lesson[currentLang];

        const extraBox = document.getElementById('feedback-extra');
        const extra = state.history[state.history.length - 1].extra;
        if (extra) {
            extraBox.textContent = extra;
            extraBox.classList.remove('hidden');
        } else {
            extraBox.classList.add('hidden');
        }

        const cashDelta = currentQ.emergency ? -(opt.emergencyCost || 0) : (opt.moneyChange || 0);
        const moneyColor = cashDelta >= 0 ? 'text-green-600' : 'text-red-600';
        const stressColor = (opt.stressChange || 0) <= 0 ? 'text-green-600' : 'text-orange-600';

        const stat = document.getElementById('stat-changes');
        stat.innerHTML = '';

        const moneyCard = document.createElement('div');
        moneyCard.className = 'flex-1 bg-gray-50 p-2.5 rounded-lg text-center border border-gray-100';
        const moneyTitle = document.createElement('span');
        moneyTitle.className = 'text-[10px] text-gray-400 block uppercase font-semibold mb-0.5';
        moneyTitle.textContent = text('budgetChange');
        const moneyVal = document.createElement('span');
        moneyVal.className = `text-xs font-bold ${moneyColor}`;
        moneyVal.textContent = `${cashDelta >= 0 ? '+' : ''}${formatHKD(cashDelta)}`;
        moneyCard.appendChild(moneyTitle);
        moneyCard.appendChild(moneyVal);

        const stressCard = document.createElement('div');
        stressCard.className = 'flex-1 bg-gray-50 p-2.5 rounded-lg text-center border border-gray-100';
        const stressTitle = document.createElement('span');
        stressTitle.className = 'text-[10px] text-gray-400 block uppercase font-semibold mb-0.5';
        stressTitle.textContent = text('stressChange');
        const stressVal = document.createElement('span');
        stressVal.className = `text-xs font-bold ${stressColor}`;
        stressVal.textContent = `${(opt.stressChange || 0) > 0 ? '+' : ''}${opt.stressChange || 0}`;
        stressCard.appendChild(stressTitle);
        stressCard.appendChild(stressVal);

        stat.appendChild(moneyCard);
        stat.appendChild(stressCard);
    }

    function nextStage() {
        if (!state.answered) return;
        state.answered = false;

        if (state.stress >= 100) {
            document.getElementById('stress-modal').classList.remove('hidden');
            return;
        }
        if (state.debt >= 5000) {
            document.getElementById('bankrupt-modal').classList.remove('hidden');
            return;
        }

        state.stage += 1;
        if (state.stage >= gameData.length) {
            generateReport();
            return;
        }

        const recurringMsg = applyMonthlyRecurring(gameData[state.stage].month);
        loadQuestion();
        if (recurringMsg) {
            const note = document.getElementById('recurring-note');
            note.textContent = recurringMsg;
            note.classList.remove('hidden');
        }
    }

    function scoreTag(value) {
        if (value >= 75) return `${value} · ${text('scoreGood')}`;
        if (value >= 50) return `${value} · ${text('scoreFair')}`;
        return `${value} · ${text('scoreRisk')}`;
    }

    function generateReport() {
        document.getElementById('stress-modal').classList.add('hidden');
        document.getElementById('bankrupt-modal').classList.add('hidden');

        document.getElementById('game-screen').classList.remove('flex');
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('report-screen').classList.remove('hidden');
        document.getElementById('report-screen').classList.add('flex');

        const netWorth = state.money + state.emergency + state.essentialsPool - state.debt;
        const financial = Math.max(0, Math.min(100, Math.round((netWorth / START_BUDGET) * 100 + 35)));
        const wellbeing = Math.max(0, Math.min(100, Math.round((state.wellbeing + (100 - state.stress)) / 2)));
        const debtResp = Math.max(0, Math.min(100, Math.round(100 - (state.debt / START_BUDGET) * 130)));
        const resilience = Math.max(0, Math.min(100, Math.round((state.academic + state.resilience) / 2)));

        const icon = document.getElementById('report-icon');
        if (state.stress >= 100 || wellbeing < 40) {
            icon.textContent = '🤯';
            icon.className = 'w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-3 shadow-sm text-3xl bg-red-100 text-red-600';
        } else if (state.debt >= 5000 || debtResp < 35) {
            icon.textContent = '💸';
            icon.className = 'w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-3 shadow-sm text-3xl bg-red-100 text-red-600';
        } else {
            icon.textContent = '🏆';
            icon.className = 'w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-3 shadow-sm text-3xl bg-green-100 text-green-600';
        }

        document.getElementById('report-money').textContent = formatHKD(netWorth);
        document.getElementById('report-stress-val').textContent = `${state.stress}/100`;
        document.getElementById('score-financial').textContent = scoreTag(financial);
        document.getElementById('score-wellbeing').textContent = scoreTag(wellbeing);
        document.getElementById('score-debt').textContent = scoreTag(debtResp);
        document.getElementById('score-resilience').textContent = scoreTag(resilience);

        let advice = '';
        if (debtResp < 45) {
            advice = currentLang === 'zh'
                ? '你的債務壓力偏高。下次應提高每月必要開支分配、預留應急金，並減少依賴信用卡。'
                : 'Your debt pressure is high. Next run, allocate more to essentials, protect emergency savings, and reduce card reliance.';
        } else if (wellbeing < 50) {
            advice = currentLang === 'zh'
                ? '你有一定財務意識，但身心狀態偏低。理財不應以犧牲健康與睡眠換取。'
                : 'You managed money somewhat well, but wellbeing is low. Good planning should not sacrifice health and sleep.';
        } else if (financial >= 75 && resilience >= 70) {
            advice = currentLang === 'zh'
                ? '你在財務、壓力與學習狀態之間保持良好平衡，展現了穩健的學期規劃能力。'
                : 'You maintained strong balance across finance, stress, and study status. This is resilient semester planning.';
        } else {
            advice = currentLang === 'zh'
                ? '你已完成學期，但仍有優化空間：提升緊急儲備、定期檢視訂閱、避免極端取向。'
                : 'You completed the semester with room to improve: build emergency savings, audit subscriptions, and avoid extremes.';
        }
        document.getElementById('report-advice').textContent = advice;

        const history = document.getElementById('report-history');
        history.innerHTML = '';
        state.history.forEach((h, idx) => {
            const q = gameData[h.stage];
            const opt = q.options[h.option];
            const card = document.createElement('div');
            card.className = 'p-3 bg-gray-50 rounded-xl border border-gray-100 text-xs';

            const top = document.createElement('div');
            top.className = 'font-bold text-gray-800 mb-1';
            top.textContent = `Q${idx + 1}. ${q.title[currentLang]}`;
            const choice = document.createElement('p');
            choice.className = 'text-gray-600 mb-1';
            choice.textContent = `${text('choiceLabel')}${opt.text[currentLang]}`;
            const lesson = document.createElement('p');
            lesson.className = 'text-[10px] text-blue-600';
            lesson.textContent = opt.lesson[currentLang];

            card.appendChild(top);
            card.appendChild(choice);
            card.appendChild(lesson);
            history.appendChild(card);
        });

        const lessons = document.getElementById('report-lessons');
        lessons.innerHTML = '';
        const uniqueLessons = [];
        state.history.forEach((h) => {
            const lesson = gameData[h.stage].options[h.option].lesson[currentLang];
            if (!uniqueLessons.includes(lesson)) uniqueLessons.push(lesson);
        });
        uniqueLessons.slice(0, 6).forEach((item) => {
            const li = document.createElement('li');
            li.textContent = item;
            lessons.appendChild(li);
        });
    }

    function resetGame() {
        state.started = false;
        document.getElementById('report-screen').classList.remove('flex');
        document.getElementById('report-screen').classList.add('hidden');
        document.getElementById('lang-container').classList.remove('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
        document.getElementById('start-screen').classList.add('flex');

        document.getElementById('essentials-input').value = 4800;
        document.getElementById('flex-input').value = 3000;
        document.getElementById('emergency-input').value = 1200;
        refreshAllocationSummary();
    }

    function downloadScreenshot() {
        const reportElement = document.getElementById('report-screen');
        reportElement.classList.add('exporting');

        html2canvas(document.getElementById('report-content'), {
            scale: 2,
            backgroundColor: '#ffffff',
            useCORS: true
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = currentLang === 'zh' ? '90日財務保衛戰-報告.png' : '90_Days_Finance_Report.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            reportElement.classList.remove('exporting');
        }).catch(() => {
            alert(currentLang === 'zh' ? '截圖生成失敗，請稍後再試。' : 'Screenshot failed, please try again.');
            reportElement.classList.remove('exporting');
        });
    }

    ['essentials-input', 'flex-input', 'emergency-input'].forEach((id) => {
        document.getElementById(id).addEventListener('input', refreshAllocationSummary);
    });

    window.onload = () => {
        document.getElementById('essentials-input').value = 4800;
        document.getElementById('flex-input').value = 3000;
        document.getElementById('emergency-input').value = 1200;
        updateStaticText();
    };
</script>

</body>
</html>
